<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS PWA - v23.0 (v22.3 Extended)</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.9);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: var(--text-main); overflow: hidden; position: fixed; width: 100%; height: 100%; touch-action: none; }

        /* UI Layers */
        #map-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; background: #111; }
        #map-image { position: absolute; transform-origin: top left; display: none; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        #other-cursors-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* HUD Panels */
        .hud-panel { position: absolute; background: var(--panel-bg); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; z-index: 100; }
        
        #status-bar { top: 10px; left: 10px; right: 10px; height: 40px; display: flex; align-items: center; padding: 0 15px; justify-content: space-between; font-weight: bold; letter-spacing: 1px; }
        .v-tag { font-size: 10px; color: var(--accent-primary); opacity: 0.8; }

        #controls { bottom: 20px; left: 10px; width: 220px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Coordinate Input Cells */
        .coord-group { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; border-left: 3px solid var(--accent-primary); }
        .coord-label { font-size: 11px; color: var(--text-dim); margin-bottom: 5px; display: block; }
        .cell-input-row { display: flex; align-items: center; gap: 4px; }
        .cell-int { width: 45px; text-align: right; }
        .cell-dec { flex: 1; }
        input[type="number"], input[type="text"] { background: #000; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 4px; font-size: 14px; outline: none; }
        input:focus { border-color: var(--accent-primary); }

        #btn-share { position: absolute; bottom: 20px; right: 10px; width: 80px; height: 75px; background: var(--accent-secondary); border: none; border-radius: 15px; color: white; font-size: 24px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        #btn-share span { font-size: 9px; margin-top: 5px; font-weight: bold; }

        #group-panel { position: absolute; top: 60px; right: 10px; width: 180px; padding: 10px; display: none; flex-direction: column; gap: 8px; }
        .user-tag { background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 20px; font-size: 12px; display: flex; justify-content: space-between; }
        .user-tag.self { border: 1px solid var(--accent-primary); }

        /* Skin/Theme */
        .skin-dark { --accent-primary: #38bdf8; --panel-bg: rgba(30, 41, 59, 0.9); }
        .skin-tactical { --accent-primary: #a3e635; --panel-bg: rgba(20, 20, 20, 0.95); }

        .cursor-other { position: absolute; width: 20px; height: 20px; border: 2px solid #ef4444; border-radius: 50%; transform: translate(-50%, -50%); transition: all 0.3s ease; }
        .cursor-other::after { content: attr(data-name); position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; white-space: nowrap; color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <div id="status-bar" class="hud-panel">
        <div>📡 <span id="group-id-display">OFFLINE</span></div>
        <div id="gps-status" style="color: var(--danger)">GPS: DISCONNECTED</div>
        <div class="v-tag">v23.0_2026_MAY</div>
    </div>

    <div id="map-container">
        <img id="map-image" src="" alt="map">
        <canvas id="map-canvas"></canvas>
        <div id="other-cursors-layer"></div>
    </div>

    <div id="group-panel" class="hud-panel">
        <div style="font-size: 12px; border-bottom: 1px solid #444; padding-bottom: 5px;">MEMBER LIST</div>
        <div id="member-list"></div>
    </div>

    <div id="controls" class="hud-panel">
        <div class="coord-group">
            <span class="coord-label">P1 (Top-Left) [Lat . Dec]</span>
            <div class="cell-input-row">
                <input type="number" id="p1-lat-int" class="cell-int" placeholder="35">
                <span>.</span>
                <input type="number" id="p1-lat-dec" class="cell-dec" placeholder="123456">
            </div>
            <span class="coord-label" style="margin-top:5px;">[Lng . Dec]</span>
            <div class="cell-input-row">
                <input type="number" id="p1-lng-int" class="cell-int" placeholder="139">
                <span>.</span>
                <input type="number" id="p1-lng-dec" class="cell-dec" placeholder="654321">
            </div>
        </div>

        <div class="coord-group">
            <span class="coord-label">P2 (Bottom-Right) [Lat . Dec]</span>
            <div class="cell-input-row">
                <input type="number" id="p2-lat-int" class="cell-int" placeholder="35">
                <span>.</span>
                <input type="number" id="p2-lat-dec" class="cell-dec" placeholder="123000">
            </div>
            <span class="coord-label" style="margin-top:5px;">[Lng . Dec]</span>
            <div class="cell-input-row">
                <input type="number" id="p2-lng-int" class="cell-int" placeholder="139">
                <span>.</span>
                <input type="number" id="p2-lng-dec" class="cell-dec" placeholder="650000">
            </div>
        </div>

        <button id="btn-save-map" style="padding: 10px; border-radius: 8px; background: var(--success); color: white; border: none; font-weight: bold;">CALIBRATE & LOCK</button>
        <input type="file" id="map-upload" accept="image/*" style="display:none">
        <button onclick="document.getElementById('map-upload').click()" style="padding: 10px; border-radius: 8px; background: #444; color: white; border: none; font-size: 11px;">UPLOAD MAP IMAGE</button>
    </div>

    <button id="btn-share">📡<span>SHARE</span></button>

    <script>
        // --- CONFIG & STATE ---
        const firebaseConfig = {
            apiKey: "AIzaSyB-EXAMPLE-KEY",
            authDomain: "your-app.firebaseapp.com",
            databaseURL: "https://your-app-default-rtdb.firebaseio.com",
            projectId: "your-app",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const state = {
            userId: 'user_' + Math.random().toString(36).substr(2, 5),
            userName: 'MEMBER_' + Math.random().toString(36).substr(2, 3).toUpperCase(),
            groupId: 'ALPHA-01',
            isSharing: false,
            p1: null, p2: null,
            userPos: { lat: 0, lng: 0 },
            mapLocked: false,
            scale: 1,
            metersPerPixel: 0
        };

        // --- INITIALIZATION ---
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');
        const mapImg = document.getElementById('map-image');

        // --- GPS LOGIC ---
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(pos => {
                state.userPos.lat = pos.coords.latitude;
                state.userPos.lng = pos.coords.longitude;
                document.getElementById('gps-status').innerText = "GPS: ACTIVE";
                document.getElementById('gps-status').style.color = "var(--success)";
                requestRender();
                if (state.isSharing) syncToFirebase();
            }, err => {
                document.getElementById('gps-status').innerText = "GPS: ERROR";
            }, { enableHighAccuracy: true, maximumAge: 0 });
        }

        // --- MAP CALIBRATION ---
        document.getElementById('btn-save-map').addEventListener('click', () => {
            const p1Lat = parseFloat(document.getElementById('p1-lat-int').value + '.' + document.getElementById('p1-lat-dec').value);
            const p1Lng = parseFloat(document.getElementById('p1-lng-int').value + '.' + document.getElementById('p1-lng-dec').value);
            const p2Lat = parseFloat(document.getElementById('p2-lat-int').value + '.' + document.getElementById('p2-lat-dec').value);
            const p2Lng = parseFloat(document.getElementById('p2-lng-int').value + '.' + document.getElementById('p2-lng-dec').value);

            if (isNaN(p1Lat) || isNaN(p2Lat)) return alert("Invalid Coordinates");

            state.p1 = { lat: p1Lat, lng: p1Lng };
            state.p2 = { lat: p2Lat, lng: p2Lng };
            state.mapLocked = true;
            
            // Calculate Meters Per Pixel (Simple approximation)
            const dy = Math.abs(p1Lat - p2Lat) * 111320;
            state.metersPerPixel = dy / mapImg.height;
            
            requestRender();
        });

        document.getElementById('map-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                mapImg.src = event.target.result;
                mapImg.style.display = 'block';
                mapImg.onload = () => {
                    canvas.width = mapImg.width;
                    canvas.height = mapImg.height;
                };
            };
            reader.readAsDataURL(file);
        });

        // --- RENDER LOGIC ---
        function requestRender() {
            if (!state.mapLocked || !mapImg.complete) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Self Cursor
            const pos = latLngToPixel(state.userPos.lat, state.userPos.lng);
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = state.isSharing ? '#818cf8' : '#38bdf8';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.strokeWidth = 3;
            ctx.stroke();
        }

        function latLngToPixel(lat, lng) {
            const x = ((lng - state.p1.lng) / (state.p2.lng - state.p1.lng)) * mapImg.width;
            const y = ((lat - state.p1.lat) / (state.p2.lat - state.p1.lat)) * mapImg.height;
            return { x, y };
        }

        // --- FIREBASE SYNC ---
        document.getElementById('btn-share').addEventListener('click', () => {
            state.isSharing = !state.isSharing;
            document.getElementById('btn-share').style.background = state.isSharing ? "var(--danger)" : "var(--accent-secondary)";
            document.getElementById('group-panel').style.display = state.isSharing ? "flex" : "none";
            document.getElementById('group-id-display').innerText = state.isSharing ? state.groupId : "OFFLINE";
            
            if (!state.isSharing) {
                db.ref(`groups/${state.groupId}/users/${state.userId}`).remove();
                document.getElementById('other-cursors-layer').innerHTML = '';
            }
        });

        function syncToFirebase() {
            db.ref(`groups/${state.groupId}/users/${state.userId}`).update({
                name: state.userName,
                lat: state.userPos.lat,
                lng: state.userPos.lng,
                lastSeen: firebase.database.ServerValue.TIMESTAMP
            });
        }

        db.ref(`groups/${state.groupId}/users`).on('value', snapshot => {
            if (!state.isSharing) return;
            const users = snapshot.val();
            const memberList = document.getElementById('member-list');
            const cursorLayer = document.getElementById('other-cursors-layer');
            memberList.innerHTML = '';
            cursorLayer.innerHTML = '';

            for (let id in users) {
                if (id === state.userId) continue;
                const u = users[id];
                
                // Update List
                const div = document.createElement('div');
                div.className = 'user-tag';
                div.innerHTML = `<span>${u.name}</span><span style="color:var(--accent-primary)">LIVE</span>`;
                memberList.appendChild(div);

                // Update Cursor
                if (state.mapLocked) {
                    const pos = latLngToPixel(u.lat, u.lng);
                    const cursor = document.createElement('div');
                    cursor.className = 'cursor-other';
                    cursor.setAttribute('data-name', u.name);
                    cursor.style.left = pos.x + 'px';
                    cursor.style.top = pos.y + 'px';
                    cursorLayer.appendChild(cursor);
                }
            }
        });

        // Clean up on close
        window.onbeforeunload = () => {
            if (state.isSharing) db.ref(`groups/${state.groupId}/users/${state.userId}`).remove();
        };
    </script>
</body>
</html>
