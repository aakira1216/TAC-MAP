<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Map Tracker Tactical v22.0</title>
    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { 
            --bg: #0f172a; --panel-bg: rgba(30, 41, 59, 0.9); --accent: #3b82f6; 
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1); --filter-color: transparent;
        }
        /* スキン・UI設定 (v22.0準拠) */
        body.theme-1 { --bg: #d2b48c; --panel-bg: rgba(210, 180, 140, 0.95); --accent: #d97706; --text: #1a1a1a; --filter-color: rgba(217, 119, 6, 0.07); }
        body.theme-2 { --bg: #2d3436; --panel-bg: rgba(60, 70, 50, 0.95); --accent: #a3b18a; --text: #dad7cd; --filter-color: rgba(163, 177, 138, 0.08); }
        body.theme-3 { --bg: #000000; --panel-bg: rgba(20, 15, 0, 0.95); --accent: #ffbf00; --text: #ffbf00; --filter-color: rgba(255, 191, 0, 0.07); }
        body.theme-4 { --bg: #000000; --panel-bg: rgba(20, 0, 0, 0.95); --accent: #ff0000; --text: #ff0000; --filter-color: rgba(255, 0, 0, 0.07); }
        body.theme-5 { --bg: #000000; --panel-bg: rgba(0, 20, 0, 0.9); --accent: #39ff14; --text: #39ff14; --filter-color: rgba(57, 255, 20, 0.08); }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100dvh; width: 100%; position: fixed; transition: background 0.3s, color 0.3s; }
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; z-index: 1; }
        #map-img { display: none; pointer-events: none; vertical-align: top; }
        
        .player-marker { position: absolute; transform: translate(-50%, -50%); z-index: 1004; pointer-events: none; text-align: center; }
        .player-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; margin: 0 auto; box-shadow: 0 0 8px rgba(0,0,0,0.5); }
        .player-name { font-size: 10px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 1px 4px; border-radius: 4px; margin-top: 2px; white-space: nowrap; }

        #panel { position: fixed; bottom: 20px; left: 15px; right: 15px; padding: 15px; background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 20px; z-index: 2000; border: 1px solid rgba(255,255,255,0.1); }
        .step { display: none; } .active { display: block; }
        button { width: 100%; padding: 14px; margin: 5px 0; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; touch-action: manipulation; }
        .blue { background: var(--accent); color: white; } 
        .outline { background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.4); color: var(--text); }
        
        #team-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; background: var(--panel-bg); padding: 20px; border-radius: 24px; border: 1px solid var(--accent); z-index: 3500; }
        #team-status-bar { position: fixed; top: 10px; left: 15px; background: var(--glass); padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; display: none; z-index: 1001; border: 1px solid var(--glass-border); }
    </style>
</head>
<body class="theme-0">

<div id="viewport">
    <div id="map-container"><img id="map-img"></div>
    <div id="player-layer"></div>
    <!-- 既存レイヤー省略 (v22.0準拠で実装してください) -->
</div>

<div id="team-status-bar"></div>

<div id="team-panel">
    <h3 style="text-align:center; color:var(--accent); margin-top:0;">タクティカル共有設定</h3>
    <input type="text" id="share-name" placeholder="表示名（例: Alpha1）" style="width:90%; padding:10px; margin-bottom:10px; border-radius:8px; background:#1a1a1a; color:white; border:1px solid #333;">
    <input type="text" id="share-group" placeholder="グループID" style="width:90%; padding:10px; margin-bottom:10px; border-radius:8px; background:#1a1a1a; color:white; border:1px solid #333;">
    <input type="text" id="share-team" placeholder="チーム名" style="width:90%; padding:10px; margin-bottom:10px; border-radius:8px; background:#1a1a1a; color:white; border:1px solid #333;">
    <button class="blue" onclick="startSharing()">共有開始</button>
    <button class="outline" onclick="toggleTeamPanel()" style="margin-top:10px;">閉じる</button>
</div>

<div id="panel">
    <div id="s0" class="step active">
        <h3 style="margin:0;color:var(--accent);">Map Tracker Tactical v22.0</h3>
        <button class="outline" onclick="toggleTeamPanel()" style="border-color:var(--accent)">📡 チーム共有設定</button>
        <!-- 既存メニュー -->
    </div>
</div>

<script>
    // --- 1. Firebase構成 (画像7枚目より正確に反映) ---
    const firebaseConfig = {
        apiKey: "AIzaSyDKPvOcJ0y79_7_oVW0KF8YR0",
        authDomain: "tac-map-multi.firebaseapp.com",
        databaseURL: "https://tac-map-multi-default-rtdb.firebaseio.com",
        projectId: "tac-map-multi",
        storageBucket: "tac-map-multi.appspot.com",
        messagingSenderId: "530840369600",
        appId: "1:530840369600:web:88b595c9789a"
    };
    
    // Firebase初期化
    let db_fb = null;
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db_fb = firebase.database();
    } catch(e) { 
        console.error("Firebase初期化失敗:", e);
        alert("Firebaseの接続に失敗しました。設定を確認してください。");
    }

    // --- 2. 状態管理 (v22.0 継承) ---
    const state = { 
        myId: 'anon-' + Math.random().toString(36).substr(2, 5),
        sharing: false, group: '', team: '', name: '', side: 'blue',
        userPos: { x: 0, y: 0 },
        players: {},
        scale: 1, x: 0, y: 0 // 地図の座標・縮尺（既存ロジック用）
    };

    const el = id => document.getElementById(id);

    // --- 3. 共有ロジック ---
    function toggleTeamPanel() { el('team-panel').style.display = el('team-panel').style.display === 'block' ? 'none' : 'block'; }

    function startSharing() {
        if(!db_fb) return;
        state.name = el('share-name').value || "Unknown";
        state.group = el('share-group').value;
        state.team = el('share-team').value;

        if(!state.group || !state.team) return alert("グループIDとチーム名を入力してください。");
        
        state.sharing = true;
        
        // 他プレイヤーの監視
        const ref = db_fb.ref(`groups/${state.group}/players`);
        ref.on('value', snapshot => {
            state.players = snapshot.val() || {};
            renderPlayers(); // プレイヤー描画更新
        });

        el('team-panel').style.display = 'none';
        el('team-status-bar').style.display = 'block';
        el('team-status-bar').innerText = `📡 ${state.team} | ${state.name}`;
    }

    // 自分の位置をクラウドに送信
    function updateCloudPos(x, y) {
        if(!state.sharing || !db_fb) return;
        state.userPos.x = x;
        state.userPos.y = y;
        db_fb.ref(`groups/${state.group}/players/${state.myId}`).set({
            name: state.name, team: state.team, x: x, y: y,
            timestamp: Date.now()
        });
    }

    // プレイヤーを描画する関数
    function renderPlayers() {
        const pLayer = el('player-layer');
        if(!pLayer) return;
        pLayer.innerHTML = '';
        
        if(state.sharing) {
            for(let id in state.players) {
                if(id === state.myId) continue;
                const p = state.players[id];
                
                // 座標計算 (地図のスケールと移動量を考慮)
                const tx = state.x + (p.x * state.scale);
                const ty = state.y + (p.y * state.scale);
                
                const m = document.createElement('div');
                m.className = 'player-marker';
                m.style.left = tx + 'px'; m.style.top = ty + 'px';
                
                const dotColor = (p.team === state.team) ? 'var(--success)' : 'white';
                m.innerHTML = `
                    <div class="player-dot" style="background:${dotColor}"></div>
                    <div class="player-name">${p.name}</div>
                `;
                pLayer.appendChild(m);
            }
        }
    }

    // GPSの位置更新時に呼び出す (既存のwatchPosition内に組み込んでください)
    // updateCloudPos(currentX, currentY);

    // --- 以降、v22.0の既存マップ制御ロジックをそのまま継続 ---
</script>
</body>
</html>
