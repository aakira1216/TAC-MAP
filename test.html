<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>TAC-MAP v24.3</title>
    <style>
        /* v22.3 黄金比UI - 完全継承 */
        :root { 
            --bg: #0f172a; --panel-bg: rgba(30, 41, 59, 0.9); --accent: #3b82f6; 
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1); --filter-color: transparent;
        }
        body.theme-1 { --bg: #d2b48c; --panel-bg: rgba(210, 180, 140, 0.95); --accent: #d97706; --text: #1a1a1a; --filter-color: rgba(217, 119, 6, 0.07); }
        body.theme-2 { --bg: #2d3436; --panel-bg: rgba(60, 70, 50, 0.95); --accent: #a3b18a; --text: #dad7cd; --filter-color: rgba(163, 177, 138, 0.08); }
        body.theme-3 { --bg: #000000; --panel-bg: rgba(20, 15, 0, 0.95); --accent: #ffbf00; --text: #ffbf00; --filter-color: rgba(255, 191, 0, 0.07); }
        body.theme-4 { --bg: #000000; --panel-bg: rgba(20, 0, 0, 0.95); --accent: #ff0000; --text: #ff0000; --filter-color: rgba(255, 0, 0, 0.07); }
        body.theme-5 { --bg: #000000; --panel-bg: rgba(0, 20, 0, 0.9); --accent: #39ff14; --text: #39ff14; --filter-color: rgba(57, 255, 20, 0.08); }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100dvh; width: 100%; position: fixed; transition: background 0.3s, color 0.3s; }
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; z-index: 1; }
        #map-img { display: none; pointer-events: none; vertical-align: top; }
        
        .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; transform: translate(-50%, -50%); display: none; z-index: 1000; pointer-events: none; box-shadow: 0 0 6px rgba(0,0,0,0.5); }
        
        /* v24.3 追加: 他ユーザー用カーソル */
        .cursor-other { position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; transform: translate(-50%, -50%); z-index: 1050; pointer-events: none; box-shadow: 0 0 4px rgba(0,0,0,0.8); background: #ff4444; }
        .cursor-other-label { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; white-space: nowrap; }

        .target-marker { position: absolute; font-weight: bold; font-size: 18px; z-index: 1005; pointer-events: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--glass); backdrop-filter: blur(4px); border: 2px solid var(--glass-border); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        #user-container { position: absolute; pointer-events: none; display: none; z-index: 1100; }
        #user-dot { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 24px solid var(--accent); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -70%); }
        
        #ui-overlay { position: fixed; top: 44px; right: 15px; display: none; flex-direction: column; gap: 12px; z-index: 2000; }
        .ui-btn { width: 50px; height: 50px; background: var(--panel-bg); color: var(--text); border-radius: 12px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        
        #panel { position: fixed; bottom: 20px; left: 15px; right: 15px; padding: 15px; background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 20px; z-index: 3000; border: 1px solid rgba(255,255,255,0.1); }
        .step { display: none; } .active { display: block; }
        button { width: 100%; padding: 14px; margin: 5px 0; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; touch-action: manipulation; }
        .blue { background: var(--accent); color: white; } 
        .outline { background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.4); color: var(--text); }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box; }

        /* 同期設定用ポップアップ */
        #sync-menu { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: var(--panel-bg); backdrop-filter: blur(20px); border-radius: 20px; padding: 20px; z-index: 4000; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="map-container"><img id="map-img"></div>
    <div id="other-layer"></div>
    <div id="p1-dot" class="dot"></div>
    <div id="p2-dot" class="dot"></div>
    <div id="user-container"><div id="user-dot"></div></div>
</div>

<div id="ui-overlay">
    <div class="ui-btn" onclick="toggleTracking()">🎯</div>
    <div class="ui-btn" onclick="cycleRotateMode()">🧭</div>
    <div class="ui-btn" onclick="el('sync-menu').style.display='block'">📡</div>
</div>

<div id="panel">
    <div id="s0" class="step active">
        <h3 style="margin:0; color:var(--accent);">TAC-MAP v24.3</h3>
        <button class="blue" onclick="startNewMap()">＋ 新規マップ</button>
        <button class="outline" onclick="showMapList()">📂 保存地図</button>
    </div>
    <div id="s2" class="step">
        <p id="guide" style="font-weight:bold;">地点1をタップ</p>
        <div id="p1-inputs">
            <div style="display:flex; gap:4px;"><input type="number" id="lat1_int" placeholder="35">.<input type="number" id="lat1_dec" placeholder="0000"></div>
            <div style="display:flex; gap:4px;"><input type="number" id="lng1_int" placeholder="135">.<input type="number" id="lng1_dec" placeholder="0000"></div>
            <button onclick="confirmP1()" class="blue">P1確定</button>
        </div>
        <div id="p2-inputs" style="display:none">
            <div style="display:flex; gap:4px;"><input type="number" id="lat2_int" placeholder="35">.<input type="number" id="lat2_dec" placeholder="0001"></div>
            <div style="display:flex; gap:4px;"><input type="number" id="lng2_int" placeholder="135">.<input type="number" id="lng2_dec" placeholder="0001"></div>
            <button onclick="confirmP2()" class="blue">P2確定</button>
        </div>
    </div>
    <div id="s4" class="step">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="status" style="font-size:12px; font-weight:bold;">GPS待機中...</div>
            <button onclick="location.reload()" class="outline" style="width:auto; margin:0; padding:8px 15px;">終了</button>
        </div>
    </div>
</div>

<div id="sync-menu">
    <h4 style="margin:0 0 15px 0; text-align:center;">📡 グループ共有</h4>
    <input type="text" id="group-id" placeholder="グループ名" value="ROOM1">
    <input type="text" id="nick-name" placeholder="ニックネーム" value="Player">
    <button class="blue" onclick="startSync()">同期開始</button>
    <button class="outline" onclick="el('sync-menu').style.display='none'">閉じる</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const fbConf = { databaseURL: "https://tac-map-multi-default-rtdb.firebaseio.com", projectId: "tac-map-multi" };
    let db, myId = 'U' + Math.random().toString(36).substr(2,4).toUpperCase();

    window.startSync = function() {
        const gid = el('group-id').value || "PUBLIC";
        const app = initializeApp(fbConf);
        db = getDatabase(app);
        
        onValue(ref(db, `groups/${gid}/users`), (snap) => {
            window.remoteUsers = snap.val() || {};
            if(window.requestRender) window.requestRender();
        });

        window.isSyncing = true;
        window.currentGid = gid;
        el('sync-menu').style.display = 'none';
        onDisconnect(ref(db, `groups/${gid}/users/${myId}`)).remove();
    };

    window.sendPos = (pos) => {
        if(!window.isSyncing) return;
        update(ref(db, `groups/${window.currentGid}/users/${myId}`), {
            x: pos.x, y: pos.y, n: el('nick-name').value, ts: Date.now()
        });
    };
</script>

<script>
    /* v22.3 ロジック完全復元 */
    let state = { step:0, x:0, y:0, scale:1, isTracking:true, rotateMode:0, userPos:{x:0,y:0}, userHeading:0, mapNorth:0, p1:null, p2:null, currentImg:null };
    let pointers = [], lastPoint = null, lastDist = 0, ticking = false;
    const el = id => document.getElementById(id);

    function render() {
        const vw = el('viewport').clientWidth, vh = el('viewport').clientHeight;
        const rot = (state.rotateMode === 1) ? -state.mapNorth : (state.rotateMode === 2) ? -state.mapNorth - state.userHeading : 0;
        const rad = rot * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
        const sx = vw/2, sy = (state.rotateMode === 2) ? vh*0.7 : vh/2;

        if(state.isTracking && state.userPos.x) {
            state.x = sx - (state.userPos.x * state.scale * cos - state.userPos.y * state.scale * sin);
            state.y = sy - (state.userPos.x * state.scale * sin + state.userPos.y * state.scale * cos);
        }

        el('map-container').style.transform = `translate(${state.x}px, ${state.y}px) rotate(${rot}deg) scale(${state.scale})`;

        // 自己位置
        if(state.userPos.x) {
            const ux = state.x + (state.userPos.x * state.scale * cos - state.userPos.y * state.scale * sin);
            const uy = state.y + (state.userPos.x * state.scale * sin + state.userPos.y * state.scale * cos);
            el('user-container').style.display = 'block';
            el('user-container').style.transform = `translate(${ux}px, ${uy}px)`;
            el('user-dot').style.transform = `translate(-50%, -50%) rotate(${state.userHeading + state.mapNorth + rot}deg)`;
            if(window.sendPos) window.sendPos(state.userPos);
        }

        // 他ユーザー描画 (v24.3)
        const oLayer = el('other-layer');
        oLayer.innerHTML = '';
        if(window.remoteUsers) {
            Object.keys(window.remoteUsers).forEach(uid => {
                if(uid.includes(window.myId)) return;
                const u = window.remoteUsers[uid];
                const rx = state.x + (u.x * state.scale * cos - u.y * state.scale * sin);
                const ry = state.y + (u.x * state.scale * sin + u.y * state.scale * cos);
                oLayer.innerHTML += `<div class="cursor-other" style="left:${rx}px; top:${ry}px;"><div class="cursor-other-label">${u.n}</div></div>`;
            });
        }
    }

    // イベント系 (v22.3維持)
    el('viewport').onpointerdown = e => { pointers.push(e); if(pointers.length===1) lastPoint={x:e.clientX, y:e.clientY}; else lastDist=Math.hypot(pointers[0].clientX-pointers[1].clientX, pointers[0].clientY-pointers[1].clientY); };
    el('viewport').onpointermove = e => {
        const i = pointers.findIndex(p=>p.pointerId===e.pointerId); if(i===-1)return; pointers[i]=e;
        if(pointers.length===1 && lastPoint){ state.x+=e.clientX-lastPoint.x; state.y+=e.clientY-lastPoint.y; lastPoint={x:e.clientX, y:e.clientY}; state.isTracking=false; }
        else if(pointers.length===2){ 
            const d=Math.hypot(pointers[0].clientX-pointers[1].clientX, pointers[0].clientY-pointers[1].clientY), z=d/lastDist;
            state.scale*=z; lastDist=d; state.isTracking=false;
        }
        requestRender();
    };
    el('viewport').onpointerup = () => { pointers=[]; lastDist=0; };

    window.requestRender = () => { if(!ticking){ requestAnimationFrame(()=>{render(); ticking=false;}); ticking=true; } };

    function startNewMap() {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const f = e.target.files[0]; el('map-img').src = URL.createObjectURL(f);
            el('map-img').onload = () => { el('map-img').style.display='block'; showStep(2); };
        }; input.click();
    }

    function confirmP1() { 
        const lat = parseFloat(el('lat1_int').value + "." + el('lat1_dec').value);
        const lng = parseFloat(el('lng1_int').value + "." + el('lng1_dec').value);
        state.p1 = { x: 500, y: 500, lat, lng }; // 簡易位置。本来はタップ座標
        el('p1-inputs').style.display='none'; el('p2-inputs').style.display='block'; el('guide').innerText="地点2を確定";
    }

    function confirmP2() {
        const lat = parseFloat(el('lat2_int').value + "." + el('lat2_dec').value);
        const lng = parseFloat(el('lng2_int').value + "." + el('lng2_dec').value);
        state.p2 = { x: 600, y: 600, lat, lng };
        showStep(4); el('ui-overlay').style.display='flex';
        navigator.geolocation.watchPosition(p => {
            const la = p.coords.latitude, lo = p.coords.longitude;
            state.userPos = {
                x: state.p1.x + (lo - state.p1.lng) / (state.p2.lng - state.p1.lng) * (state.p2.x - state.p1.x),
                y: state.p1.y + (la - state.p1.lat) / (state.p2.lat - state.p1.lat) * (state.p2.y - state.p1.y)
            };
            el('status').innerText = "受信中"; requestRender();
        }, null, {enableHighAccuracy:true});
    }

    function showStep(n) { document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); el('s'+n).classList.add('active'); state.step=n; }
    function toggleTracking() { state.isTracking = !state.isTracking; requestRender(); }
    function cycleRotateMode() { state.rotateMode = (state.rotateMode + 1) % 3; requestRender(); }
</script>
</body>
</html>
