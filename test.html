<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Map Tracker Pro v22.3 - Tactical Edition</title>
    <style>
        :root { 
            --bg: #0f172a; --panel-bg: rgba(30, 41, 59, 0.9); --accent: #3b82f6; 
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1); --filter-color: transparent;
        }
        body.theme-1 { --bg: #d2b48c; --panel-bg: rgba(210, 180, 140, 0.95); --accent: #d97706; --text: #1a1a1a; --filter-color: rgba(217, 119, 6, 0.07); }
        body.theme-2 { --bg: #2d3436; --panel-bg: rgba(60, 70, 50, 0.95); --accent: #a3b18a; --text: #dad7cd; --filter-color: rgba(163, 177, 138, 0.08); }
        body.theme-3 { --bg: #000000; --panel-bg: rgba(20, 15, 0, 0.95); --accent: #ffbf00; --text: #ffbf00; --filter-color: rgba(255, 191, 0, 0.07); }
        body.theme-4 { --bg: #000000; --panel-bg: rgba(20, 0, 0, 0.95); --accent: #ff0000; --text: #ff0000; --filter-color: rgba(255, 0, 0, 0.07); }
        body.theme-5 { --bg: #000000; --panel-bg: rgba(0, 20, 0, 0.9); --accent: #39ff14; --text: #39ff14; --filter-color: rgba(57, 255, 20, 0.08); }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100dvh; width: 100%; position: fixed; transition: background 0.3s, color 0.3s; }
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        #map-filter { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: var(--filter-color); transition: background 0.3s; }
        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; z-index: 1; }
        #map-img { display: none; pointer-events: none; vertical-align: top; }
        #proximity-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5000; display: none; background: rgba(239, 68, 68, 0.25); animation: full-screen-blink 0.6s infinite; }
        @keyframes full-screen-blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; display: none; z-index: 1000; pointer-events: none; box-shadow: 0 0 6px rgba(0,0,0,0.5); transform: translate(-50%, -50%); }
        .target-marker { position: absolute; font-weight: bold; font-size: 18px; z-index: 1005; pointer-events: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--glass); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 2px solid var(--glass-border); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        #user-container { position: absolute; pointer-events: none; display: none; z-index: 1100; }
        #user-dot-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #user-dot { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 24px solid var(--accent); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -70%); }
        #hud-visual { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #hud-info-list { position: absolute; top: 45px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 0px; padding: 4px 10px; border-radius: 10px; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--glass-border); min-width: max-content; width: auto; pointer-events: none; }
        .hud-row { font-size: 12px; font-weight: 900; text-shadow: 1px 1px 2px #000; font-family: 'SF Mono', Menlo, monospace; white-space: nowrap; display: flex; align-items: center; height: 18px; text-align: left; width: 100%; }
        .nearest-indicator { width: 8px; height: 8px; background: #ff0000; border-radius: 50%; margin-right: 8px; flex-shrink: 0; box-shadow: 0 0 4px #ff0000; }
        .nearest-placeholder { width: 8px; height: 8px; margin-right: 8px; flex-shrink: 0; visibility: hidden; }
        #line-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 900; }
        #scale-bar-container { position: fixed; bottom: 116px; right: 15px; z-index: 1200; pointer-events: none; display: none; flex-direction: column; align-items: center; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px; border-radius: 12px; border: 1px solid var(--glass-border); width: 110px; }
        #scale-label { font-size: 12px; font-weight: 900; text-shadow: 0 0 4px #000; margin-bottom: 4px; font-family: monospace; color: white; }
        #scale-bar { height: 4px; width: 100px; background: linear-gradient(90deg, #fff 50%, #000 50%); background-size: 20px 100%; border: 1px solid #fff; }
        #panel { position: fixed; bottom: 20px; left: 15px; right: 15px; padding: 15px; background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 20px; z-index: 2000; border: 1px solid rgba(255,255,255,0.1); }
        .step { display: none; } .active { display: block; }
        button { width: 100%; padding: 14px; margin: 5px 0; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; touch-action: manipulation; }
        button:active:not(:disabled) { transform: scale(0.96); opacity: 0.8; }
        button:disabled { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        .blue { background: var(--accent); color: white; } 
        .red { background: var(--danger); color: white; } 
        .outline { background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.4); color: var(--text); }
        .outline-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--text); }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box; }
        .coord-row { display: flex; align-items: center; gap: 4px; }
        #ui-overlay { position: fixed; top: 44px; right: 15px; display: none; flex-direction: column; gap: 12px; z-index: 1002; }
        .ui-btn { width: 50px; height: 50px; background: var(--panel-bg); color: var(--text); border-radius: 12px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        #btn-share { height: 75px !important; flex-direction: column; font-size: 20px; }
        #btn-share span { font-size: 10px; font-weight: bold; margin-top: 2px; }
        .id-badge { background: #1e293b; padding: 6px 12px; border-radius: 6px; font-family: monospace; border: 1px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body>

<div id="proximity-overlay"></div>
<div id="viewport">
    <div id="map-container"><img id="map-img"></div>
    <div id="map-filter"></div>
    <svg id="line-svg"></svg>
    <div id="p1-dot" class="dot"></div>
    <div id="p2-dot" class="dot"></div>
    <div id="temp-target-dot" class="dot"></div>
    <div id="target-layer"></div>
    <div id="remote-layer"></div> <div id="user-container">
        <div id="user-dot-wrapper">
             <div id="user-dot"></div>
             <svg id="hud-visual" width="1000" height="1000" viewBox="0 0 1000 1000">
                <circle cx="500" cy="500" r="0" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" id="hud-circle" />
                <path id="hud-wedge" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.5)" stroke-width="2" />
            </svg>
        </div>
        <div id="hud-info-list" style="display:none;"></div>
    </div>
</div>

<div id="scale-bar-container"><div id="scale-label">---m</div><div id="scale-bar"></div></div>

<div id="ui-overlay">
    <div id="btn-lock" class="ui-btn" onclick="toggleTracking()">🎯</div>
    <div id="btn-rotate" class="ui-btn" onclick="cycleRotateMode()">🧭</div>
    <div id="btn-share" class="ui-btn" onclick="openShareMenu()">📡<span>共有</span></div>
</div>

<div id="panel">
    <div id="s0" class="step active">
        <h3 style="margin:0;color:var(--accent);">Map Tracker Pro v22.3</h3>
        <button class="blue" onclick="startNewMap()">＋ 新規マップ</button>
        <button class="outline" onclick="showMapList()">📂 保存地図</button>
    </div>
    
    <div id="s2" class="step">
        <p id="guide" style="margin:0; font-weight:bold;">地点1を登録してください</p>
        <div id="p1-inputs">
            <div class="coord-row"><input type="text" id="lat1_int">.<input type="text" id="lat1_dec"></div>
            <div class="coord-row"><input type="text" id="lng1_int">.<input type="text" id="lng1_dec"></div>
            <button onclick="confirmP1()" class="red">P1登録</button>
        </div>
        <div id="p2-inputs" style="display:none">
            <div class="coord-row"><input type="text" id="lat2_int">.<input type="text" id="lat2_dec"></div>
            <div class="coord-row"><input type="text" id="lng2_int">.<input type="text" id="lng2_dec"></div>
            <button onclick="confirmP2()" class="blue">P2登録</button>
        </div>
    </div>

    <div id="s4" class="step">
        <div id="status" style="font-size:12px; margin-bottom:5px;">GPS待機中...</div>
        <div style="display:flex; gap:5px;">
            <button id="gyro-btn" onclick="askGyro()" class="blue" style="font-size:12px;">🧭 許可</button>
            <button onclick="exitApp()" class="outline-danger" style="font-size:12px;">終了</button>
        </div>
    </div>

    <div id="s-sync" class="step">
        <h3 style="text-align:center; color:var(--accent);">📡 GROUP SHARE</h3>
        <div class="id-badge" id="share-id-display">ID: ---</div>
        <input type="text" id="share-id-input" placeholder="参加用IDを入力">
        <input type="text" id="user-nickname" placeholder="ニックネーム" value="Player1">
        <button class="blue" onclick="startGroupShare()">共有開始</button>
        <button class="outline" onclick="showStep(4)">戻る</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>

<script>
    const DB_NAME = "MapTrackerDB", STORE_NAME = "maps";
    let db, pointers = [], lastPoint = null, ticking = false; 
    const state = { 
        step: 0, p1: null, p2: null, scale: 1, x: 0, y: 0, isTracking: true, rotateMode: 0, mapNorth: 0, metersPerPixel: 0,
        userPos: {x:0, y:0}, userHeading: 0, remoteUsers: {}, targets: [], colors: ["#facc15", "#a855f7", "#f97316", "#22d3ee", "#fb7185"]
    };

    const firebaseConfig = {
        apiKey: "AIzaSyDKPvOcJ0y79_7_oVW0KF8YR0iKcF4o_cc",
        authDomain: "tac-map-multi.firebaseapp.com",
        databaseURL: "https://tac-map-multi-default-rtdb.firebaseio.com",
        projectId: "tac-map-multi",
        storageBucket: "tac-map-multi.firebasestorage.app",
        messagingSenderId: "530840369600",
        appId: "1:530840369600:web:88b595c9789acd54b4b025"
    };

    function haptic() { if (window.navigator.vibrate) window.navigator.vibrate(10); }

    const el = id => document.getElementById(id), vNode = el('viewport'), container = el('map-container');

    async function initDB() {
        return new Promise(r => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
            req.onsuccess = e => { db = e.target.result; r(); };
        });
    }

    function showStep(n){ haptic(); document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); if(el('s'+n)) el('s'+n).classList.add('active'); state.step=n; requestRender(); }

    function openShareMenu() { haptic(); el('share-id-display').innerText = "ID: " + Math.random().toString(36).substring(2, 8).toUpperCase(); showStep('-sync'); }

    function startGroupShare() {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const idInput = el('share-id-input').value;
        const groupId = idInput ? idInput.toUpperCase() : el('share-id-display').innerText.replace('ID: ', '');
        const nickname = el('user-nickname').value || 'Unknown';
        const dbRef = firebase.database().ref('groups/' + groupId);

        setInterval(() => {
            if (state.userPos.x) {
                dbRef.child('members/' + nickname).set({ x: state.userPos.x, y: state.userPos.y, h: state.userHeading, ts: Date.now() });
            }
        }, 3000);

        dbRef.child('members').on('value', snap => {
            const val = snap.val();
            if (val) {
                const others = {};
                for (let k in val) { if (k !== nickname) others[k] = val[k]; }
                state.remoteUsers = others;
            }
        });
        alert("同期開始: " + groupId);
        showStep(4);
    }

    function startNewMap() { 
        const input = document.createElement('input'); input.type='file'; input.accept='image/*'; 
        input.onchange=e=>{ 
            const file=e.target.files[0]; if(!file)return; 
            const img = el('map-img'); img.src = URL.createObjectURL(file); 
            img.onload = () => { img.style.display='block'; fitImage(); showStep(2); }; 
        }; 
        input.click(); 
    }

    function fitImage() {
        const img = el('map-img'), vw = vNode.clientWidth, vh = vNode.clientHeight;
        state.scale = Math.min(vw/img.naturalWidth, vh/img.naturalHeight)*0.8;
        state.x = vw/2 - (img.naturalWidth/2*state.scale); state.y = vh/2 - (img.naturalHeight/2*state.scale);
        requestRender();
    }

    vNode.addEventListener('pointerdown', e => { vNode.setPointerCapture(e.pointerId); pointers.push(e); if(pointers.length === 1) lastPoint = { x: e.clientX, y: e.clientY }; });
    vNode.addEventListener('pointermove', e => {
        const idx = pointers.findIndex(p => p.pointerId === e.pointerId); if(idx === -1) return; pointers[idx] = e;
        if(pointers.length === 1 && lastPoint) { state.x += e.clientX - lastPoint.x; state.y += e.clientY - lastPoint.y; lastPoint = { x: e.clientX, y: e.clientY }; state.isTracking = false; } 
        requestRender();
    });
    vNode.addEventListener('pointerup', e => { pointers = pointers.filter(p => p.pointerId !== e.pointerId); lastPoint = null; });

    function requestRender() { if(!ticking) { window.requestAnimationFrame(() => { render(); ticking = false; }); ticking = true; } }

    function render() {
        const vw = vNode.clientWidth, vh = vNode.clientHeight;
        const rot = (state.rotateMode === 1) ? -state.mapNorth : (state.rotateMode === 2) ? -state.mapNorth - state.userHeading : 0;
        const rad = rot * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad), sx = vw / 2, sy = (state.rotateMode === 2) ? vh * 0.7 : vh / 2;
        
        if(state.isTracking && state.userPos.x){ 
            state.x = sx - (state.userPos.x * state.scale * cos - state.userPos.y * state.scale * sin); 
            state.y = sy - (state.userPos.x * state.scale * sin + state.userPos.y * state.scale * cos); 
        } 
        
        container.style.transform = `translate(${state.x}px, ${state.y}px) rotate(${rot}deg) scale(${state.scale})`;

        const rLayer = el('remote-layer'); rLayer.innerHTML = '';
        for(let name in state.remoteUsers) {
            const r = state.remoteUsers[name];
            const rx = state.x + (r.x * state.scale * cos - r.y * state.scale * sin);
            const ry = state.y + (r.x * state.scale * sin + r.y * state.scale * cos);
            const dot = document.createElement('div'); dot.className = 'dot'; dot.style.display = 'block';
            dot.style.left = rx + 'px'; dot.style.top = ry + 'px'; dot.style.backgroundColor = '#10b981';
            rLayer.appendChild(dot);
        }

        const uPosScreen = state.userPos.x ? { sx: state.x + (state.userPos.x * state.scale * cos - state.userPos.y * state.scale * sin), sy: state.y + (state.userPos.x * state.scale * sin + state.userPos.y * state.scale * cos) } : null;
        if(uPosScreen) {
            el('user-container').style.left = uPosScreen.sx + 'px'; el('user-container').style.top = uPosScreen.sy + 'px'; el('user-container').style.display = 'block';
            el('user-dot-wrapper').style.transform = `translate(-50%, -50%) rotate(${state.userHeading + state.mapNorth + rot}deg)`;
        }
    }

    function confirmP1() { 
        state.p1 = { x: (vNode.clientWidth/2 - state.x)/state.scale, y: (vNode.clientHeight/2 - state.y)/state.scale, lat: parseFloat(el('lat1_int').value + "." + el('lat1_dec').value), lng: parseFloat(el('lng1_int').value + "." + el('lng1_dec').value) };
        el('p1-inputs').style.display = 'none'; el('p2-inputs').style.display = 'block'; el('guide').innerText = "地点2を登録してください";
    }

    function confirmP2() {
        state.p2 = { x: (vNode.clientWidth/2 - state.x)/state.scale, y: (vNode.clientHeight/2 - state.y)/state.scale, lat: parseFloat(el('lat2_int').value + "." + el('lat2_dec').value), lng: parseFloat(el('lng2_int').value + "." + el('lng2_dec').value) };
        const p1 = state.p1, p2 = state.p2, r = Math.PI/180;
        state.metersPerPixel = (6371000 * Math.acos(Math.sin(p1.lat*r)*Math.sin(p2.lat*r)+Math.cos(p1.lat*r)*Math.cos(p2.lat*r)*Math.cos((p2.lng-p1.lng)*r))) / Math.hypot(p2.x-p1.x, p2.y-p1.y);
        state.mapNorth = (Math.atan2(p2.x-p1.x, p1.y-p2.y)*180/Math.PI) - (Math.atan2(p2.lng-p1.lng, p2.lat-p1.lat)*180/Math.PI);
        saveAndStart();
    }

    function saveAndStart() { 
        showStep(4); el('ui-overlay').style.display='flex';
        navigator.geolocation.watchPosition(p => {
            state.userPos = { x: state.p1.x + (p.coords.longitude - state.p1.lng)/(state.p2.lng - state.p1.lng)*(state.p2.x - state.p1.x), y: state.p1.y + (p.coords.latitude - state.p1.lat)/(state.p2.lat - state.p1.lat)*(state.p2.y - state.p1.y) };
            el('status').innerText = `精度: ±${Math.round(p.coords.accuracy)}m`; requestRender();
        }, null, {enableHighAccuracy:true});
    }

    function toggleTracking() { haptic(); state.isTracking = !state.isTracking; requestRender(); }
    function cycleRotateMode() { haptic(); state.rotateMode = (state.rotateMode + 1) % 3; requestRender(); }
    async function askGyro() { if(typeof DeviceOrientationEvent.requestPermission === 'function'){ await DeviceOrientationEvent.requestPermission(); } window.addEventListener('deviceorientation', e => { state.userHeading = e.webkitCompassHeading || (360 - e.alpha); requestRender(); }, true); }
    function exitApp() { location.reload(); }

    window.onload = initDB;
</script>
</body>
</html>
