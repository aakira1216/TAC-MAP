<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Map Tracker Pro v28.0 - Tactical Presence</title>
    <style>
        :root { 
            --bg: #0f172a; --panel-bg: rgba(30, 41, 59, 0.9); --accent: #3b82f6; 
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1); --filter-color: transparent;
        }
        /* スキン定義 & フィルター色設定 */
        body.theme-1 { --bg: #d2b48c; --panel-bg: rgba(210, 180, 140, 0.95); --accent: #d97706; --text: #1a1a1a; --filter-color: rgba(217, 119, 6, 0.07); }
        body.theme-2 { --bg: #2d3436; --panel-bg: rgba(60, 70, 50, 0.95); --accent: #a3b18a; --text: #dad7cd; --filter-color: rgba(163, 177, 138, 0.08); }
        body.theme-3 { --bg: #000000; --panel-bg: rgba(20, 15, 0, 0.95); --accent: #ffbf00; --text: #ffbf00; --filter-color: rgba(255, 191, 0, 0.07); }
        body.theme-4 { --bg: #000000; --panel-bg: rgba(20, 0, 0, 0.95); --accent: #ff0000; --text: #ff0000; --filter-color: rgba(255, 0, 0, 0.07); }
        body.theme-5 { --bg: #000000; --panel-bg: rgba(0, 20, 0, 0.9); --accent: #39ff14; --text: #39ff14; --filter-color: rgba(57, 255, 20, 0.08); }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100dvh; width: 100%; position: fixed; transition: background 0.3s, color 0.3s; }
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        #map-filter { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: var(--filter-color); transition: background 0.3s; }
        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; z-index: 1; }
        #map-img { display: none; pointer-events: none; vertical-align: top; }
        
        /* 退場通知ポップアップ */
        #notice-layer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; display: flex; flex-direction: column; gap: 8px; width: 80%; max-width: 300px; }
        .notice-toast { background: var(--panel-bg); color: var(--text); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--danger); backdrop-filter: blur(10px); font-size: 13px; font-weight: bold; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto; animation: toast-in 0.3s ease-out; }
        @keyframes toast-in { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; transform: translate(-50%, -50%); display: none; z-index: 1000; pointer-events: none; box-shadow: 0 0 6px rgba(0,0,0,0.5); }
        .target-marker { position: absolute; font-weight: bold; font-size: 18px; z-index: 1005; pointer-events: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--glass); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 2px solid var(--glass-border); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        #user-container { position: absolute; pointer-events: none; display: none; z-index: 1100; }
        #user-dot-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #user-dot { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 24px solid var(--accent); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -70%); }
        #hud-visual { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        
        #hud-info-list { position: absolute; top: 45px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 0px; padding: 4px 10px; border-radius: 10px; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--glass-border); min-width: max-content; width: auto; pointer-events: none; }
        .hud-row { font-size: 12px; font-weight: 900; text-shadow: 1px 1px 2px #000; font-family: 'SF Mono', Menlo, monospace; white-space: nowrap; display: flex; align-items: center; height: 18px; text-align: left; width: 100%; }
        .nearest-indicator { width: 8px; height: 8px; background: #ff0000; border-radius: 50%; margin-right: 8px; flex-shrink: 0; box-shadow: 0 0 4px #ff0000; }
        .nearest-placeholder { width: 8px; height: 8px; margin-right: 8px; flex-shrink: 0; visibility: hidden; }
        
        #scale-bar-container { position: fixed; bottom: 116px; right: 15px; z-index: 1200; pointer-events: none; display: none; flex-direction: column; align-items: center; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px; border-radius: 12px; border: 1px solid var(--glass-border); width: 110px; }
        #scale-label { font-size: 12px; font-weight: 900; text-shadow: 0 0 4px #000; margin-bottom: 4px; font-family: monospace; color: white; }
        #scale-bar { height: 4px; width: 100px; background: linear-gradient(90deg, #fff 50%, #000 50%); background-size: 20px 100%; border: 1px solid #fff; }
        
        #panel { position: fixed; bottom: 20px; left: 15px; right: 15px; padding: 15px; background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 20px; z-index: 2000; border: 1px solid rgba(255,255,255,0.1); }
        .step { display: none; } .active { display: block; }
        button { width: 100%; padding: 14px; margin: 5px 0; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; touch-action: manipulation; }
        button:active:not(:disabled) { transform: scale(0.96); opacity: 0.8; }
        button:disabled { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        .blue { background: var(--accent); color: white; } 
        .red { background: var(--danger); color: white; } 
        .outline { background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.4); color: var(--text); }
        .outline-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--text); }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box; }
        .coord-row { display: flex; align-items: center; gap: 4px; }

        @media (orientation: landscape) {
            #panel:has(#s0.active), #panel:has(#s2.active) { top: 15px !important; left: 15px !important; bottom: auto !important; right: auto !important; width: 140px !important; padding: 12px !important; border-radius: 12px !important; }
            #s0 h3 { font-size: 12px !important; margin-bottom: 8px !important; text-align: center; }
            #s0 button, #s2 button { padding: 10px 0 !important; font-size: 12px !important; margin: 4px 0 !important; }
            #panel:has(#s-list.active), #panel:has(#s-import.active), #panel:has(#s-sync.active) { top: 50% !important; left: 50% !important; bottom: auto !important; right: auto !important; transform: translate(-50%, -50%) !important; width: 320px !important; padding: 20px !important; border-radius: 20px !important; max-height: 85dvh; overflow: hidden; display: flex; flex-direction: column; background: var(--panel-bg); box-shadow: 0 0 40px rgba(0,0,0,0.8); }
            #panel:has(#s4.active) { left: 15px; right: auto; top: 15px; bottom: 15px; width: 80px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: content-box; }
            #s4 { height: 100%; }
            #s4 > div { height: 100%; display: flex !important; flex-direction: column !important; justify-content: space-between !important; align-items: center !important; }
            #status { text-align: center; font-size: 11px; width: 100%; margin: 0; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
            #s4 > div > div:last-child { display: flex; flex-direction: column; width: 100%; gap: 8px; }
            #s4 button { width: 80px !important; margin: 0 !important; height: 36px !important; padding: 0 !important; font-size: 11px !important; }
            #ui-overlay { top: 50% !important; right: 15px; transform: translateY(-50%) !important; display: flex; flex-direction: column; gap: 12px; }
            #scale-bar-container { top: auto; bottom: 15px; right: 15px; display: flex !important; }
        }

        #hud-config-panel, #target-setting-panel { display: none; position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 340px; background: var(--panel-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--accent); z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #ui-overlay { position: fixed; top: 44px; right: 15px; display: none; flex-direction: column; gap: 12px; z-index: 1002; }
        .ui-btn { width: 50px; height: 50px; background: var(--panel-bg); color: var(--text); border-radius: 12px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: 0.3s; }
        
        @keyframes share-blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .share-retry { animation: share-blink 0.8s infinite; color: var(--danger) !important; border-color: var(--danger) !important; }
        .share-active { color: var(--accent) !important; border-color: var(--accent) !important; }

        #btn-share { height: 75px !important; flex-direction: column; font-size: 20px; }
        #btn-share span { font-size: 10px; font-weight: bold; margin-top: 2px; color: inherit; line-height: 1.2; text-align: center; }

        .share-role-selector { display: flex; gap: 10px; margin: 15px 0; }
        .share-role-selector label { flex: 1; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 14px; }
        .share-role-selector input { width: auto; margin-right: 8px; }
        .share-role-selector label:has(input:checked) { border-color: var(--accent); background: rgba(59, 130, 246, 0.2); }
        
        .cursor-other { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 1px solid #fff; background: #3b82f6; transform: translate(-50%, -50%); z-index: 1050; pointer-events: none; box-shadow: 0 0 4px rgba(0,0,0,0.5); transition: opacity 0.3s; }
        .cursor-other::after { content: attr(data-name); position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; background: rgba(0,0,0,0.7); color: white; padding: 2px 4px; border-radius: 3px; white-space: nowrap; }
        .cursor-lost { opacity: 0.4; }
    </style>
</head>
<body>

<div id="notice-layer"></div>
<div id="proximity-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5000; display: none; background: rgba(239, 68, 68, 0.25); animation: full-screen-blink 0.6s infinite;"></div>
<div id="viewport">
    <div id="map-container"><img id="map-img"></div>
    <div id="map-filter"></div>
    <svg id="line-svg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 900;"></svg>
    <div id="p1-dot" class="dot"></div>
    <div id="p2-dot" class="dot"></div>
    <div id="temp-target-dot" class="dot"></div>
    <div id="target-layer"></div>
    <div id="other-cursors-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1090;"></div>
    <div id="user-container">
        <div id="user-dot-wrapper">
             <div id="user-dot"></div>
             <svg id="hud-visual" width="1000" height="1000" viewBox="0 0 1000 1000">
                <circle cx="500" cy="500" r="0" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" id="hud-circle" />
                <path id="hud-wedge" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.5)" stroke-width="2" />
            </svg>
        </div>
        <div id="hud-info-list" style="display:none;"></div>
    </div>
</div>

<div id="scale-bar-container"><div id="scale-label">---m</div><div id="scale-bar"></div></div>

<div id="target-guide" style="position: fixed; top: 100px; left: 50%; transform: translateX(-50%); background: var(--panel-bg); backdrop-filter: blur(10px); border: 2px solid var(--accent); padding: 15px; border-radius: 15px; font-weight: bold; display: none; z-index: 4000; text-align: center; width: 240px;">
    <div id="target-guide-text" style="margin-bottom:12px;"></div>
    <div style="display:flex; gap:10px;">
        <button id="target-decide-btn" class="blue" style="margin:0; padding:10px; flex:1;">決定</button>
        <button id="target-cancel-btn" class="outline" style="margin:0; padding:10px; flex:1;" onclick="cancelTargeting()">戻る</button>
    </div>
</div>

<div id="target-setting-panel">
    <p style="text-align:center; font-weight:bold;">続けて次の目標を設定しますか？</p>
    <div style="display:flex; gap:10px;">
        <button class="blue" onclick="continueTargetFlow()">はい</button>
        <button class="outline" onclick="closeTargetFlow()">いいえ</button>
    </div>
</div>

<div id="hud-config-panel">
    <h3 style="margin:0 0 15px 0; text-align:center; color:var(--accent);">HUD設定</h3>
    <div style="display: flex; gap: 30px; margin-bottom: 10px;">
        <div style="flex: 1; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 14px; font-weight: 600;"><span>HUD表示</span><input type="checkbox" id="hud-enable" onchange="updateHudSettings()" style="width:20px; margin:0;"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 14px; font-weight: 600;"><span>スキン切り替え</span><input type="checkbox" id="skin-enable" onchange="toggleSkinList()" style="width:20px; margin:0;"></div>
            <div id="skin-list-area" style="display:none; padding:8px 12px; background:rgba(0,0,0,0.2); border-radius:10px; margin-top:5px;">
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; font-weight: 600;"><input type="radio" name="skin" value="1" onchange="applySkin(1)"><span>1. デザート</span></div>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; font-weight: 600;"><input type="radio" name="skin" value="2" onchange="applySkin(2)"><span>2. カモ</span></div>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; font-weight: 600;"><input type="radio" name="skin" value="3" onchange="applySkin(3)"><span>3. レトロ</span></div>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; font-weight: 600;"><input type="radio" name="skin" value="4" onchange="applySkin(4)"><span>4. インフラ</span></div>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; font-weight: 600;"><input type="radio" name="skin" value="5" onchange="applySkin(5)"><span>5. コクピット</span></div>
            </div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 14px; font-weight: 600;"><span>半径</span><select id="hud-radius-select" onchange="updateHudSettings()" style="background:#1a1a1a;color:white; margin:0;"></select></div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 14px; font-weight: 600;"><span>近接通知</span><input type="checkbox" id="proximity-enable" onchange="updateHudSettings()" style="width:20px; margin:0;"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 14px; font-weight: 600;"><span>新規目標</span><input type="checkbox" id="target-enable" onchange="handleTargetCheck(this)" style="width:20px; margin:0;"></div>
            <div id="target-config-list" style="max-height:160px; overflow-y:auto; border-top:1px solid #444; margin-top:10px;"></div>
        </div>
    </div>
    <div style="display:flex; justify-content:center;"><button class="blue" onclick="toggleHudConfig()" style="margin-top:10px; width:120px;">閉じる</button></div>
</div>

<div id="ui-overlay">
    <div id="btn-lock" class="ui-btn" onclick="toggleTracking()">🎯</div>
    <div id="btn-rotate" class="ui-btn" onclick="cycleRotateMode()">🧭</div>
    <div id="btn-share" class="ui-btn" onclick="openShareMenu()">📡<span>シェア<br><span id="share-indicator">--</span></span></div>
</div>

<div id="panel">
    <div id="s0" class="step active">
        <h3 style="margin:0;color:var(--accent); font-size:16px;">Map Tracker Pro v28.0</h3>
        <button class="blue" onclick="startNewMap()">＋ 新規マップ</button>
        <button class="outline" onclick="showMapList()">📂 保存地図</button>
        <button class="outline" onclick="showImportScreen()" style="border-color:var(--success)">📥 インポート</button>
    </div>
    
    <div id="s2" class="step">
        <p id="guide" style="margin:0 0 5px 0; font-weight:bold; font-size: 13px;">地点1をタップ</p>
        <div id="p1-inputs">
            <div class="coord-row"><input type="text" id="lat1_int" placeholder="35">. <input type="text" id="lat1_dec" placeholder="00000"></div>
            <div class="coord-row"><input type="text" id="lng1_int" placeholder="135">. <input type="text" id="lng1_dec" placeholder="00000"></div>
            <button onclick="confirmP1()" class="red">P1登録</button>
        </div>
        <div id="p2-inputs" style="display:none">
            <div class="coord-row"><input type="text" id="lat2_int" placeholder="35">. <input type="text" id="lat2_dec" placeholder="00001"></div>
            <div class="coord-row"><input type="text" id="lng2_int" placeholder="135">. <input type="text" id="lng2_dec" placeholder="00001"></div>
            <button onclick="confirmP2()" class="blue" style="background:var(--success)">P2登録</button>
        </div>
    </div>

    <div id="s4" class="step">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="status" style="font-size:13px; font-weight:bold;">GPS待機中...</div>
            <div style="display:flex; gap:6px;">
                <button id="proximity-dismiss-btn" onclick="dismissProximity()" class="outline-danger" style="display:none; margin:0; padding:8px 10px; font-size:12px; width:auto; height:36px;">通知解除</button>
                <button id="gyro-btn" onclick="askGyro()" class="blue" style="margin:0; padding:8px 10px; font-size:12px; width:auto; height:36px;">🧭 方位許可</button>
                <button onclick="toggleHudConfig()" class="outline" style="padding:8px; font-size:12px; width:80px; margin:0; height:36px;">HUD設定</button>
                <button onclick="exitApp()" class="outline-danger" style="padding:8px; font-size:12px; width:50px; margin:0; height:36px;">終了</button>
            </div>
        </div>
    </div>

    <div id="s-list" class="step"><h3 style="text-align:center; color:var(--accent);">保存済みマップ</h3><div id="map-list-container" style="max-height:300px; overflow-y:auto; margin-bottom:15px;"></div><button class="outline" onclick="showStep(0)">戻る</button></div>
    <div id="s-import" class="step"><h3 style="text-align:center; color:var(--success);">インポート</h3><button class="blue" onclick="triggerImportFile()">ファイルを選択</button><button class="outline" onclick="showStep(0)" style="margin-top:10px;">キャンセル</button></div>

    <div id="s-sync" class="step">
        <h3 style="margin:0 0 15px 0; text-align:center; color:var(--accent);">📡 GROUP SHARE</h3>
        <div class="share-role-selector">
            <label><input type="radio" name="share-role" value="create" checked onchange="toggleShareRole()">作成</label>
            <label><input type="radio" name="share-role" value="read" onchange="toggleShareRole()">読み取り</label>
        </div>
        <div style="background: rgba(0,0,0,0.3); border-radius: 15px; padding: 15px; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 15px; border: 1px dashed rgba(255,255,255,0.2);">
            <div id="share-qr-view" style="display:flex; flex-direction:column; align-items:center; gap:10px;">
                <div style="width:100px; height:100px; background:white; display:flex; align-items:center; justify-content:center; color:black; font-size:10px; text-align:center;">QR CODE<br>READY</div>
                <div id="share-id-display" style="background: #1e293b; padding: 6px 12px; border-radius: 6px; font-family: monospace; border: 1px solid var(--accent); color: var(--accent);">ID: ---</div>
            </div>
            <div id="share-scan-view" style="display:none; flex-direction:column; align-items:center; gap:10px; width:100%;">
                <button class="blue" style="margin:0 0 10px 0; font-size:14px;" onclick="alert('カメラを起動します')">📷 カメラ起動</button>
                <input type="text" id="share-id-input" placeholder="IDを手動入力" style="text-align:center;">
            </div>
        </div>
        <div style="margin-bottom:15px;"><span style="font-size:12px; color:#94a3b8; margin-left:5px;">ニックネーム</span><input type="text" id="user-nickname" placeholder="Player" value="Player1"></div>
        <div id="sync-initial-btns" style="display:flex; gap:10px;"><button class="blue" style="margin:0; flex:2;" id="fb-start-btn">共有開始</button><button class="outline" style="margin:0; flex:1;" onclick="closeSyncMenu()">戻る</button></div>
        <div id="sync-active-btns" style="display:none; gap:10px;"><button class="red" style="margin:0; flex:1;" id="fb-stop-btn">同期終了</button><button class="blue" style="margin:0; flex:1;" onclick="closeSyncMenu()">マップへ</button></div>
        <div id="fb-status-msg" style="font-size:10px; color:var(--accent); text-align:center; margin-top:5px;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect, update, goOffline, goOnline } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDKPvOcJ0y79_7_oVW0KF8YR0iKcF4o_cc",
        authDomain: "tac-map-multi.firebaseapp.com",
        databaseURL: "https://tac-map-multi-default-rtdb.firebaseio.com",
        projectId: "tac-map-multi",
        storageBucket: "tac-map-multi.firebasestorage.app",
        messagingSenderId: "530840369600",
        appId: "1:530840369600:web:88b595c9789acd54b4b025"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);
    let myUid = 'U' + Math.random().toString(36).substring(2, 7).toUpperCase();
    let syncEnabled = false;
    let syncActive = false;
    let gid = "";
    let activeUserCount = 1;

    window.remoteUsers = {};

    function showNotice(text) {
        const layer = document.getElementById('notice-layer');
        const toast = document.createElement('div');
        toast.className = 'notice-toast';
        toast.innerText = text;
        toast.onclick = () => toast.remove();
        layer.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    function updateSyncButtons() {
        document.getElementById('sync-initial-btns').style.display = syncEnabled ? 'none' : 'flex';
        document.getElementById('sync-active-btns').style.display = syncEnabled ? 'flex' : 'none';
    }

    function refreshSyncUI(isConnected) {
        const msgEl = document.getElementById('fb-status-msg');
        const shareBtn = document.getElementById('btn-share');
        const indicator = document.getElementById('share-indicator');
        if (syncEnabled) {
            if (isConnected && syncActive) {
                msgEl.innerText = `同期中: ${gid} / ${activeUserCount}人`;
                shareBtn.className = 'ui-btn share-active';
                indicator.innerText = "●";
            } else {
                msgEl.innerText = "";
                shareBtn.className = 'ui-btn share-retry';
                indicator.innerText = "🚫";
            }
        } else {
            msgEl.innerText = ""; shareBtn.className = 'ui-btn'; indicator.innerText = "--";
        }
    }

    onValue(ref(db, ".info/connected"), (snapshot) => refreshSyncUI(snapshot.val() === true));

    window.toggleShareRole = function() {
        const isCreate = document.querySelector('input[name="share-role"]:checked').value === 'create';
        document.getElementById('share-qr-view').style.display = isCreate ? 'flex' : 'none';
        document.getElementById('share-scan-view').style.display = isCreate ? 'none' : 'flex';
        if(isCreate && !gid) {
            gid = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('share-id-display').innerText = "ID: " + gid;
        }
    };

    document.getElementById('fb-start-btn').onclick = () => {
        const isCreate = document.querySelector('input[name="share-role"]:checked').value === 'create';
        const inputGid = document.getElementById('share-id-input').value;
        if(!isCreate && !inputGid) { alert("IDを入力してください"); return; }
        if(!isCreate) gid = inputGid.toUpperCase();
        
        goOnline(db);
        syncEnabled = true; syncActive = false;
        
        // プレゼンス設定：接続が切れたらデータを削除（遺言）
        onDisconnect(ref(db, `groups/${gid}/users/${myUid}`)).remove();

        onValue(ref(db, `groups/${gid}/users`), (snapshot) => {
            const users = snapshot.val() || {};
            
            // 削除された（退場した）ユーザーを特定して通知
            Object.keys(window.remoteUsers).forEach(uid => {
                if(!users[uid]) {
                    showNotice(`${window.remoteUsers[uid].name} が退場しました`);
                    delete window.remoteUsers[uid];
                }
            });

            activeUserCount = Object.keys(users).length;
            processRemoteUsers(users);
            refreshSyncUI(true);
        });
        updateSyncButtons();
    };

    document.getElementById('fb-stop-btn').onclick = () => {
        if(confirm("共有同期を終了しますか？")) { window.killSync(); updateSyncButtons(); }
    };

    setInterval(() => {
        if(syncEnabled && window.state && window.state.userPos && window.state.userPos.x) {
            update(ref(db, `groups/${gid}/users/${myUid}`), {
                x: window.state.userPos.x, y: window.state.userPos.y,
                name: document.getElementById('user-nickname').value || "Player", ts: Date.now()
            }).then(() => { syncActive = true; refreshSyncUI(true); });
        }
    }, 1000);

    window.killSync = function() {
        if (syncEnabled && gid) set(ref(db, `groups/${gid}/users/${myUid}`), null);
        syncEnabled = false; syncActive = false; goOffline(db);
        window.remoteUsers = {};
        const layer = document.getElementById('other-cursors-layer');
        if(layer) layer.innerHTML = '';
        refreshSyncUI(false);
    };

    function processRemoteUsers(users) {
        if(!users || !syncEnabled) return;
        Object.keys(users).forEach(uid => {
            if(uid === myUid) return;
            const data = users[uid];
            // 通信不良判定：サーバーにデータはあるが10秒以上更新がない
            const isLost = (Date.now() - data.ts > 10000);
            
            if(!window.remoteUsers[uid]) {
                window.remoteUsers[uid] = { currX: data.x, currY: data.y, targetX: data.x, targetY: data.y, name: data.name, isLost: isLost };
            } else {
                window.remoteUsers[uid].targetX = data.x;
                window.remoteUsers[uid].targetY = data.y;
                window.remoteUsers[uid].name = data.name;
                window.remoteUsers[uid].isLost = isLost;
            }
        });
    }
</script>

<script>
    const DB_NAME = "MapTrackerDB", STORE_NAME = "maps";
    let idb, pointers = [], lastDist = 0, lastPoint = null, locationHistory = []; 
    let watchId = null; 
    const state = { 
        step: 0, p1: null, p2: null, scale: 1, x: 0, y: 0, isTracking: true, rotateMode: 0, mapNorth: 0, metersPerPixel: 0,
        userPos: {x:0, y:0}, userHeading: 0, rawHeading: 0, userAcc: 0, tempPoint: null, hudOn: false, hudRadius: 20, proximityOn: false, 
        isAlerting: false, manuallyDismissed: false, targets: [], targetMode: false, currentTargetLetter: null, 
        colors: ["#facc15", "#a855f7", "#f97316", "#22d3ee", "#fb7185"], lastRot: 0, lastRotateMode: 0, currentImgBlob: null
    };
    window.state = state;

    function haptic() { if (window.navigator.vibrate) window.navigator.vibrate(10); }
    function openShareMenu() { haptic(); document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); el('s-sync').classList.add('active'); if(window.toggleShareRole) window.toggleShareRole(); }
    function closeSyncMenu() { haptic(); showStep(4); }
    const el = id => document.getElementById(id), vNode = el('viewport'), container = el('map-container');

    const initDB = () => new Promise(r => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
        req.onsuccess = e => { idb = e.target.result; r(); };
    });

    window.onload = async () => { 
        await initDB(); 
        for(let r=5; r<=50; r+=5){ const opt=document.createElement('option'); opt.value=r; opt.textContent=r; if(r===20)opt.selected=true; el('hud-radius-select').appendChild(opt); }
        const skin = localStorage.getItem('selectedSkin');
        if(localStorage.getItem('skinEnabled') === 'true' && skin) { el('skin-enable').checked = true; el('skin-list-area').style.display = 'block'; applySkin(skin, false); }
        renderLoop();
    };

    function renderLoop() { render(); requestAnimationFrame(renderLoop); }
    function showStep(n){ haptic(); document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); if(el('s'+n)) el('s'+n).classList.add('active'); state.step=n; }
    function toggleSkinList() { const isOn = el('skin-enable').checked; el('skin-list-area').style.display = isOn ? 'block' : 'none'; localStorage.setItem('skinEnabled', isOn); if(!isOn) document.body.className = ''; }
    function applySkin(val, save=true) { haptic(); document.body.className = 'theme-' + val; if(save) localStorage.setItem('selectedSkin', val); }

    function startNewMap() { 
        haptic(); const input = document.createElement('input'); input.type='file'; input.accept='image/*'; 
        input.onchange=e=>{ 
            const file=e.target.files[0]; if(!file)return; state.currentImgBlob=file; 
            const img = el('map-img'); img.src = URL.createObjectURL(file); 
            img.onload = () => { img.style.display='block'; fitImage(); showStep(2); }; 
        }; 
        input.click(); 
    }

    function fitImage() {
        const img = el('map-img'), vw = vNode.clientWidth, vh = vNode.clientHeight;
        state.scale = Math.min(vw/img.naturalWidth, vh/img.naturalHeight)*0.8;
        state.x = vw/2 - (img.naturalWidth/2*state.scale); state.y = vh/2 - (img.naturalHeight/2*state.scale);
    }

    vNode.addEventListener('pointerdown', e => { vNode.setPointerCapture(e.pointerId); pointers.push(e); if(pointers.length === 1) lastPoint = { x: e.clientX, y: e.clientY }; else if(pointers.length === 2) lastDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY); });
    vNode.addEventListener('pointermove', e => {
        const idx = pointers.findIndex(p => p.pointerId === e.pointerId); if(idx === -1) return; pointers[idx] = e;
        if(pointers.length === 1 && lastPoint) { state.x += e.clientX - lastPoint.x; state.y += e.clientY - lastPoint.y; lastPoint = { x: e.clientX, y: e.clientY }; state.isTracking = false; } 
        else if(pointers.length === 2) { const midX = (pointers[0].clientX + pointers[1].clientX) / 2, midY = (pointers[0].clientY + pointers[1].clientY) / 2, dist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY), zoom = dist / lastDist; state.scale *= zoom; state.x = midX - (midX - state.x) * zoom; state.y = midY - (midY - state.y) * zoom; lastDist = dist; state.isTracking = false; }
    });
    const endPointer = e => { if(pointers.length === 1 && (state.step === 2 || state.targetMode)) handleTap(e); pointers = pointers.filter(p => p.pointerId !== e.pointerId); if(pointers.length < 2) lastDist = 0; };
    vNode.addEventListener('pointerup', endPointer); vNode.addEventListener('pointercancel', endPointer);

    function handleTap(e) {
        const vw = vNode.clientWidth, vh = vNode.clientHeight, rot = (state.rotateMode === 1) ? -state.mapNorth : (state.rotateMode === 2) ? -state.mapNorth - state.userHeading : 0;
        const rad = -rot * Math.PI / 180, sx = vw / 2, sy = (state.rotateMode === 2) ? vh * 0.7 : vh / 2;
        const dx = e.clientX - sx, dy = e.clientY - sy, rx = dx * Math.cos(rad) - dy * Math.sin(rad), ry = dx * Math.sin(rad) + dy * Math.cos(rad);
        state.tempPoint = { x: (rx + sx - state.x) / state.scale, y: (ry + sy - state.y) / state.scale };
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpAngle(a, b, t) { let d = b - a; while (d < -180) d += 360; while (d > 180) d -= 360; return a + d * t; }

    function render() {
        const vw = vNode.clientWidth, vh = vNode.clientHeight;
        state.userHeading = lerpAngle(state.userHeading, state.rawHeading, 0.15);
        let screenAdj = (window.orientation === 90) ? 90 : (window.orientation === -90) ? -90 : 0;
        const finalHeading = state.userHeading + screenAdj;
        const rot = (state.rotateMode === 1) ? -state.mapNorth : (state.rotateMode === 2) ? -state.mapNorth - finalHeading : 0;
        const rad = rot * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad), sx = vw / 2, sy = (state.rotateMode === 2) ? vh * 0.7 : vh / 2;
        
        if(state.isTracking && state.userPos.x){ state.x = sx - (state.userPos.x * state.scale * cos - state.userPos.y * state.scale * sin); state.y = sy - (state.userPos.x * state.scale * sin + state.userPos.y * state.scale * cos); } 
        container.style.transform = `translate(${state.x}px, ${state.y}px) rotate(${rot}deg) scale(${state.scale})`;
        
        // 他者カーソルの描画（LOSTロジック適用）
        const otherLayer = el('other-cursors-layer');
        if(otherLayer) {
            otherLayer.innerHTML = '';
            Object.keys(window.remoteUsers).forEach(uid => {
                const ru = window.remoteUsers[uid];
                ru.currX = lerp(ru.currX, ru.targetX, 0.1); ru.currY = lerp(ru.currY, ru.targetY, 0.1);
                const tx = state.x + (ru.currX * state.scale * cos - ru.currY * state.scale * sin);
                const ty = state.y + (ru.currX * state.scale * sin + ru.currY * state.scale * cos);
                const div = document.createElement('div');
                div.className = 'cursor-other' + (ru.isLost ? ' cursor-lost' : '');
                div.setAttribute('data-name', ru.name + (ru.isLost ? '...LOST' : ''));
                div.style.left = tx + 'px'; div.style.top = ty + 'px';
                otherLayer.appendChild(div);
            });
        }

        // 自位置・HUDの描画（HUD設定を優先）
        const uContainer = el('user-container');
        if(state.userPos.x){
            const ux = state.x + (state.userPos.x * state.scale * cos - state.userPos.y * state.scale * sin);
            const uy = state.y + (state.userPos.x * state.scale * sin + state.userPos.y * state.scale * cos);
            uContainer.style.left = ux + 'px'; uContainer.style.top = uy + 'px'; uContainer.style.display = 'block';
            el('user-dot-wrapper').style.transform = `translate(-50%, -50%) rotate(${finalHeading + state.mapNorth + rot}deg)`;
            const pxRadius = state.hudOn ? (state.hudRadius / state.metersPerPixel) * state.scale : 0; el('hud-circle').setAttribute('r', pxRadius);
            const sA = -60*Math.PI/180, eA = 60*Math.PI/180, x1 = 500+pxRadius*Math.sin(sA), y1 = 500-pxRadius*Math.cos(sA), x2 = 500+pxRadius*Math.sin(eA), y2 = 500-pxRadius*Math.cos(eA);
            el('hud-wedge').setAttribute('d', pxRadius > 0 ? `M 500 500 L ${x1} ${y1} A ${pxRadius} ${pxRadius} 0 0 1 ${x2} ${y2} Z` : '');
            
            // HUD情報リストの更新
            const infoList = el('hud-info-list'); infoList.innerHTML = '';
            state.targets.forEach(t => {
                if(t.showDist || t.showDir) {
                    const dM = Math.round(Math.hypot(t.x - state.userPos.x, t.y - state.userPos.y) * state.metersPerPixel);
                    const row = document.createElement('div'); row.className = 'hud-row'; row.style.color = t.color;
                    row.innerHTML = `<div class="nearest-placeholder"></div>${t.id}: ${t.showDist?dM+'m ':''}`;
                    infoList.appendChild(row);
                }
            });
            infoList.style.display = (state.hudOn && infoList.children.length > 0) ? 'flex' : 'none';
        }

        // P1, P2ドット
        const drawDot = (id, p, col) => { const d=el(id); if(!p){d.style.display='none';return;} const tx=state.x+(p.x*state.scale*cos-p.y*state.scale*sin), ty=state.y+(p.x*state.scale*sin+p.y*state.scale*cos); d.style.left=tx+'px'; d.style.top=ty+'px'; d.style.backgroundColor=col; d.style.display='block'; };
        if(state.step === 2) { drawDot('p1-dot', state.p1 || (!state.p2?state.tempPoint:null), '#ef4444'); drawDot('p2-dot', state.p1?(state.p2||state.tempPoint):null, '#10b981'); }
    }

    function confirmP1() { haptic(); const lat=parseCoord(el('lat1_int').value, el('lat1_dec').value), lng=parseCoord(el('lng1_int').value, el('lng1_dec').value); if(!state.tempPoint||isNaN(lat))return; state.p1={...state.tempPoint, lat, lng}; state.tempPoint=null; el('p1-inputs').style.display='none'; el('p2-inputs').style.display='block'; el('guide').innerText="地点2をタップ"; }
    async function confirmP2() { haptic(); const lat=parseCoord(el('lat2_int').value, el('lat2_dec').value), lng=parseCoord(el('lng2_int').value, el('lng2_dec').value); if(!state.tempPoint||isNaN(lat))return; state.p2={...state.tempPoint, lat, lng}; const p1=state.p1, p2=state.p2, r=Math.PI/180; state.metersPerPixel = (6371000 * Math.acos(Math.sin(p1.lat*r)*Math.sin(p2.lat*r)+Math.cos(p1.lat*r)*Math.cos(p2.lat*r)*Math.cos((p2.lng-p1.lng)*r))) / Math.hypot(p2.x-p1.x, p2.y-p1.y); state.mapNorth = (Math.atan2(p2.x-p1.x, p1.y-p2.y)*180/Math.PI) - (Math.atan2(p2.lng-p1.lng, p2.lat-p1.lat)*180/Math.PI); saveAndStart(); }
    function saveAndStart() { showStep(4); el('ui-overlay').style.display='flex'; watchId = navigator.geolocation.watchPosition(p => { if(p.coords.accuracy>35)return; state.userAcc=p.coords.accuracy; locationHistory.push({lat:p.coords.latitude, lng:p.coords.longitude}); if(locationHistory.length>3)locationHistory.shift(); const aLat=locationHistory.reduce((s,c)=>s+c.lat,0)/locationHistory.length, aLng=locationHistory.reduce((s,c)=>s+c.lng,0)/locationHistory.length; state.userPos={x:state.p1.x+(aLng-state.p1.lng)/(state.p2.lng-state.p1.lng)*(state.p2.x-state.p1.x), y:state.p1.y+(aLat-state.p1.lat)/(state.p2.lat-state.p1.lat)*(state.p2.y-state.p1.y)}; el('status').innerHTML=`精度: &plusmn;${Math.round(state.userAcc)}m`; }, null, {enableHighAccuracy:true}); }
    function parseCoord(i,d){ const s=i+"."+d; return parseFloat(s); }
    function toggleTracking(){ haptic(); state.isTracking=!state.isTracking; }
    function cycleRotateMode(){ haptic(); state.rotateMode=(state.rotateMode+1)%3; }
    function toggleHudConfig(){ haptic(); el('hud-config-panel').style.display=el('hud-config-panel').style.display==='block'?'none':'block'; }
    function updateHudSettings(){ haptic(); state.hudOn=el('hud-enable').checked; state.hudRadius=parseInt(el('hud-radius-select').value); state.proximityOn=el('proximity-enable').checked; }
    async function askGyro(){ haptic(); const h = e => { state.rawHeading = e.webkitCompassHeading || (360 - e.alpha); }; if(typeof DeviceOrientationEvent.requestPermission === 'function'){ if(await DeviceOrientationEvent.requestPermission()==='granted') window.addEventListener('deviceorientation', h, true); } else { window.addEventListener("deviceorientationabsolute", h, true); } el('gyro-btn').style.display='none'; }
    function exitApp() { if(window.killSync) window.killSync(); location.reload(); }
    async function showMapList() { haptic(); showStep('-list'); const l=el('map-list-container'); l.innerHTML=""; const tx=idb.transaction(STORE_NAME,"readonly"); tx.objectStore(STORE_NAME).getAll().onsuccess=e=>{ e.target.result.forEach(m=>{ const d=document.createElement('div'); d.style="display:flex; justify-content:space-between; padding:10px; background:rgba(255,255,255,0.05); margin-bottom:5px; border-radius:10px; align-items:center;"; d.innerHTML=`<span>${m.name}</span><button class="blue" style="width:60px; padding:5px; margin:0;" onclick="loadMap(${m.id})">開く</button>`; l.appendChild(d); }); }; }
    function loadMap(id){ const tx=idb.transaction(STORE_NAME,"readonly"); tx.objectStore(STORE_NAME).get(id).onsuccess=e=>{ const d=e.target.result; state.p1=d.p1; state.p2=d.p2; state.mapNorth=d.mapNorth; state.metersPerPixel=d.metersPerPixel; el('map-img').src=URL.createObjectURL(d.image); el('map-img').onload=()=>{ el('map-img').style.display='block'; fitImage(); saveAndStart(); }; }; }
</script>
