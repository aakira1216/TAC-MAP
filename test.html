<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Map Tracker Pro v22.3 - Tactical Edition</title>
    <style>
        :root { 
            --bg: #0f172a; --panel-bg: rgba(30, 41, 59, 0.9); --accent: #3b82f6; 
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1); --filter-color: transparent;
        }
        /* スキン定義 */
        body.theme-1 { --bg: #d2b48c; --panel-bg: rgba(210, 180, 140, 0.95); --accent: #d97706; --text: #1a1a1a; --filter-color: rgba(217, 119, 6, 0.07); }
        body.theme-2 { --bg: #2d3436; --panel-bg: rgba(60, 70, 50, 0.95); --accent: #a3b18a; --text: #dad7cd; --filter-color: rgba(163, 177, 138, 0.08); }
        body.theme-3 { --bg: #000000; --panel-bg: rgba(20, 15, 0, 0.95); --accent: #ffbf00; --text: #ffbf00; --filter-color: rgba(255, 191, 0, 0.07); }
        body.theme-4 { --bg: #000000; --panel-bg: rgba(20, 0, 0, 0.95); --accent: #ff0000; --text: #ff0000; --filter-color: rgba(255, 0, 0, 0.07); }
        body.theme-5 { --bg: #000000; --panel-bg: rgba(0, 20, 0, 0.9); --accent: #39ff14; --text: #39ff14; --filter-color: rgba(57, 255, 20, 0.08); }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100dvh; width: 100%; position: fixed; transition: background 0.3s, color 0.3s; }
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        #map-filter { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: var(--filter-color); }
        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; z-index: 1; }
        #map-img { display: none; pointer-events: none; vertical-align: top; }
        #proximity-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5000; display: none; background: rgba(239, 68, 68, 0.25); animation: full-screen-blink 0.6s infinite; }
        @keyframes full-screen-blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; transform: translate(-50%, -50%); display: none; z-index: 1000; pointer-events: none; }
        .target-marker { position: absolute; font-weight: bold; font-size: 18px; z-index: 1005; pointer-events: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--glass); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 2px solid var(--glass-border); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        #user-container { position: absolute; pointer-events: none; display: none; z-index: 1100; }
        #user-dot-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #user-dot { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 24px solid var(--accent); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -70%); }
        #hud-visual { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #hud-info-list { position: absolute; top: 45px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 0px; padding: 4px 10px; border-radius: 10px; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--glass-border); min-width: max-content; width: auto; pointer-events: none; }
        .hud-row { font-size: 12px; font-weight: 900; text-shadow: 1px 1px 2px #000; font-family: 'SF Mono', Menlo, monospace; white-space: nowrap; display: flex; align-items: center; height: 18px; text-align: left; width: 100%; }
        .nearest-indicator { width: 8px; height: 8px; background: #ff0000; border-radius: 50%; margin-right: 8px; flex-shrink: 0; box-shadow: 0 0 4px #ff0000; }
        .nearest-placeholder { width: 8px; height: 8px; margin-right: 8px; flex-shrink: 0; visibility: hidden; }
        #line-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 900; }
        #scale-bar-container { position: fixed; bottom: 116px; right: 15px; z-index: 1200; pointer-events: none; display: none; flex-direction: column; align-items: center; background: var(--glass); backdrop-filter: blur(10px); padding: 8px; border-radius: 12px; border: 1px solid var(--glass-border); width: 110px; }
        #scale-label { font-size: 12px; font-weight: 900; text-shadow: 0 0 4px #000; margin-bottom: 4px; font-family: monospace; color: white; }
        #scale-bar { height: 4px; width: 100px; background: linear-gradient(90deg, #fff 50%, #000 50%); background-size: 20px 100%; border: 1px solid #fff; }
        #panel { position: fixed; bottom: 20px; left: 15px; right: 15px; padding: 15px; background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 20px; z-index: 2000; border: 1px solid rgba(255,255,255,0.1); }
        .step { display: none; } .active { display: block; }
        button { width: 100%; padding: 14px; margin: 5px 0; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; touch-action: manipulation; }
        button:active:not(:disabled) { transform: scale(0.96); opacity: 0.8; }
        .blue { background: var(--accent); color: white; } 
        .red { background: var(--danger); color: white; } 
        .outline { background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.4); color: var(--text); }
        .outline-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--text); }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box; }
        .coord-row { display: flex; align-items: center; gap: 4px; }

        @media (orientation: landscape) {
            #panel:has(#s0.active), #panel:has(#s2.active) { top: 15px !important; left: 15px !important; bottom: auto !important; right: auto !important; width: 140px !important; padding: 12px !important; }
            #panel:has(#s-list.active), #panel:has(#s-import.active), #panel:has(#s-sync.active) { top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; width: 320px !important; }
            #panel:has(#s4.active) { left: 15px; top: 15px; bottom: 15px; width: 80px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
            #s4 > div { height: 100%; display: flex !important; flex-direction: column !important; justify-content: space-between !important; align-items: center !important; }
            #ui-overlay { top: 50% !important; right: 15px; transform: translateY(-50%) !important; }
        }

        #hud-config-panel, #target-setting-panel { display: none; position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 340px; background: var(--panel-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--accent); z-index: 3000; }
        #ui-overlay { position: fixed; top: 44px; right: 15px; display: none; flex-direction: column; gap: 12px; z-index: 1002; }
        .ui-btn { width: 50px; height: 50px; background: var(--panel-bg); color: var(--text); border-radius: 12px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        #btn-share { height: 75px !important; flex-direction: column; font-size: 20px; }
        #btn-share span { font-size: 10px; font-weight: bold; margin-top: 2px; }

        /* 📡 同期ウィンドウスタイル */
        .share-role-selector { display: flex; gap: 10px; margin: 15px 0; }
        .share-role-selector label { flex: 1; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
        .share-role-selector label:has(input:checked) { border-color: var(--accent); background: rgba(59, 130, 246, 0.2); }
        .share-main-area { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 15px; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 15px; border: 1px dashed rgba(255,255,255,0.2); }
        #share-qr-view { display: none; flex-direction: column; align-items: center; gap: 10px; }
        #share-scan-view { display: none; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        .id-badge { background: #1e293b; padding: 6px 12px; border-radius: 6px; font-family: monospace; font-size: 14px; border: 1px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body>

<div id="proximity-overlay"></div>
<div id="viewport">
    <div id="map-container"><img id="map-img"></div>
    <div id="map-filter"></div>
    <svg id="line-svg"></svg>
    <div id="p1-dot" class="dot"></div>
    <div id="p2-dot" class="dot"></div>
    <div id="temp-target-dot" class="dot"></div>
    <div id="target-layer"></div>
    <div id="user-container">
        <div id="user-dot-wrapper">
             <div id="user-dot"></div>
             <svg id="hud-visual" width="1000" height="1000" viewBox="0 0 1000 1000">
                <circle cx="500" cy="500" r="0" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" id="hud-circle" />
                <path id="hud-wedge" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.5)" stroke-width="2" />
            </svg>
        </div>
        <div id="hud-info-list" style="display:none;"></div>
    </div>
</div>

<div id="scale-bar-container"><div id="scale-label">---m</div><div id="scale-bar"></div></div>

<div id="ui-overlay">
    <div id="btn-lock" class="ui-btn" onclick="toggleTracking()">🎯</div>
    <div id="btn-rotate" class="ui-btn" onclick="cycleRotateMode()">🧭</div>
    <div id="btn-share" class="ui-btn" onclick="openShareMenu()">📡<span>共有</span></div>
</div>

<div id="panel">
    <div id="s0" class="step active">
        <h3 style="margin:0;color:var(--accent);">Map Tracker Pro v22.3</h3>
        <button class="blue" onclick="startNewMap()">＋ 新規マップ</button>
        <button class="outline" onclick="showMapList()">📂 保存地図</button>
        <button class="outline" onclick="showImportScreen()" style="border-color:var(--success)">📥 インポート</button>
    </div>
    
    <div id="s2" class="step">
        <p id="guide" style="margin:0 0 5px 0; font-weight:bold;">地点1をタップ</p>
        <div id="p1-inputs">
            <div class="coord-row"><input type="text" id="lat1_int">. <input type="text" id="lat1_dec"></div>
            <div class="coord-row"><input type="text" id="lng1_int">. <input type="text" id="lng1_dec"></div>
            <button onclick="confirmP1()" class="red">P1登録</button>
        </div>
        <div id="p2-inputs" style="display:none">
            <div class="coord-row"><input type="text" id="lat2_int">. <input type="text" id="lat2_dec"></div>
            <div class="coord-row"><input type="text" id="lng2_int">. <input type="text" id="lng2_dec"></div>
            <button onclick="confirmP2()" class="blue" style="background:var(--success)">P2登録</button>
        </div>
    </div>

    <div id="s4" class="step">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="status">GPS待機中...</div>
            <div style="display:flex; gap:6px;">
                <button id="gyro-btn" onclick="askGyro()" class="blue" style="width:auto; height:36px; padding:0 10px;">🧭 方位許可</button>
                <button onclick="exitApp()" class="outline-danger" style="width:50px; height:36px; padding:0;">終了</button>
            </div>
        </div>
    </div>

    <div id="s-list" class="step">
        <h3 style="margin:0 0 15px 0; text-align:center; color:var(--accent);">保存済みマップ</h3>
        <div id="map-list-container" style="max-height:300px; overflow-y:auto; margin-bottom:15px;"></div>
        <button class="outline" onclick="showStep(0)">戻る</button>
    </div>

    <div id="s-sync" class="step">
        <h3 style="margin:0 0 15px 0; text-align:center; color:var(--accent);">📡 GROUP SHARE</h3>
        <div class="share-role-selector">
            <label><input type="radio" name="share-role" value="create" checked onchange="toggleShareRole()">作成</label>
            <label><input type="radio" name="share-role" value="read" onchange="toggleShareRole()">読み取り</label>
        </div>
        <div class="share-main-area">
            <div id="share-qr-view" style="display:flex;">
                <div style="width:100px; height:100px; background:white; display:flex; align-items:center; justify-content:center; color:black; font-size:10px; text-align:center;">QR CODE<br>PLACEHOLDER</div>
                <div class="id-badge" id="share-id-display">ID: ---</div>
            </div>
            <div id="share-scan-view">
                <button class="blue" onclick="alert('カメラを起動します')">📷 カメラ起動</button>
                <input type="text" id="share-id-input" placeholder="グループIDを手動入力" style="text-align:center;">
            </div>
        </div>
        <div style="display:flex; gap:10px;">
            <button class="blue" style="flex:2;" onclick="alert('共有を開始します')">共有開始</button>
            <button class="outline-danger" style="flex:1;" onclick="closeSyncMenu()">終了</button>
        </div>
    </div>
</div>

<script>
    const DB_NAME = "MapTrackerDB", STORE_NAME = "maps";
    let db, pointers = [], lastDist = 0, lastPoint = null, ticking = false, locationHistory = []; 
    const state = { 
        step: 0, p1: null, p2: null, scale: 1, x: 0, y: 0, isTracking: true, rotateMode: 0, mapNorth: 0, metersPerPixel: 0,
        userPos: {x:0, y:0}, userHeading: 0, userAcc: 0, tempPoint: null, hudOn: false, hudRadius: 20, proximityOn: false, 
        targets: [], targetMode: false, currentImgBlob: null
    };

    function haptic() { if (window.navigator.vibrate) window.navigator.vibrate(10); }

    const initDB = () => new Promise(r => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
        req.onsuccess = e => { db = e.target.result; r(); };
    });
    const el = id => document.getElementById(id), vNode = el('viewport'), container = el('map-container');
    window.onload = async () => { await initDB(); };

    function showStep(n){ haptic(); document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); if(el('s'+n)) el('s'+n).classList.add('active'); state.step=n; requestRender(); }
    
    function startNewMap() { 
        haptic(); const input = document.createElement('input'); input.type='file'; input.accept='image/*'; 
        input.onchange=e=>{ 
            const file=e.target.files[0]; if(!file)return; 
            state.currentImgBlob=file; 
            const img = el('map-img'); img.src = URL.createObjectURL(file); 
            img.onload = () => { img.style.display='block'; fitImage(); showStep(2); }; 
        }; 
        input.click(); 
    }

    async function showMapList() {
        haptic(); showStep('-list'); const listEl = el('map-list-container'); listEl.innerHTML = "読込中...";
        const tx = db.transaction(STORE_NAME, "readonly");
        const maps = await new Promise(r => { tx.objectStore(STORE_NAME).getAll().onsuccess = e => r(e.target.result); });
        listEl.innerHTML = maps.length ? "" : "保存なし";
        maps.forEach(m => {
            const d = document.createElement('div'); d.style="display:grid; grid-template-columns: 1fr 50px 50px 50px; gap:5px; margin-bottom:8px; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; align-items:center;";
            d.innerHTML = `<span style="font-size:13px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${m.name}</span>
            <button class="blue" style="padding:8px; margin:0; font-size:11px" onclick="loadMap(${m.id})">開く</button>
            <button class="outline" style="padding:8px; margin:0; font-size:11px; border-color:var(--success)" onclick="exportMap(${m.id})">共有</button>
            <button class="red" style="padding:8px; margin:0; font-size:11px" onclick="deleteMap(${m.id})">削除</button>`;
            listEl.appendChild(d);
        });
    }

    async function loadMap(id) {
        haptic(); const tx = db.transaction(STORE_NAME, "readonly");
        tx.objectStore(STORE_NAME).get(id).onsuccess = e => {
            const data = e.target.result;
            state.p1 = data.p1; state.p2 = data.p2; state.mapNorth = data.mapNorth; state.metersPerPixel = data.metersPerPixel;
            const img = el('map-img'); img.src = URL.createObjectURL(data.image); 
            img.onload = () => { img.style.display='block'; fitImage(); saveAndStart(); };
        };
    }

    async function deleteMap(id) { if(!confirm("地図を削除しますか？")) return; haptic(); const tx = db.transaction(STORE_NAME, "readwrite"); tx.objectStore(STORE_NAME).delete(id).onsuccess = () => showMapList(); }

    async function exportMap(id) {
        haptic(); const tx = db.transaction(STORE_NAME, "readonly");
        tx.objectStore(STORE_NAME).get(id).onsuccess = e => {
            const data = e.target.result;
            const reader = new FileReader();
            reader.onload = () => {
                const exportData = JSON.stringify({ name: data.name, p1: data.p1, p2: data.p2, mapNorth: data.mapNorth, metersPerPixel: data.metersPerPixel, image_b64: reader.result });
                const blob = new Blob([exportData], {type: 'application/json'});
                const url = URL.createObjectURL(blob), a = document.createElement('a');
                a.href = url; a.download = `${data.name}.json`; a.click();
            };
            reader.readAsDataURL(data.image);
        };
    }

    function openShareMenu() { haptic(); document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); el('s-sync').classList.add('active'); toggleShareRole(); }
    function closeSyncMenu() { haptic(); showStep(4); }
    function toggleShareRole() {
        const isCreate = document.querySelector('input[name="share-role"]:checked').value === 'create';
        el('share-qr-view').style.display = isCreate ? 'flex' : 'none';
        el('share-scan-view').style.display = isCreate ? 'none' : 'flex';
        if(isCreate) el('share-id-display').innerText = "ID: " + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function fitImage() {
        const img = el('map-img'), vw = vNode.clientWidth, vh = vNode.clientHeight;
        state.scale = Math.min(vw/img.naturalWidth, vh/img.naturalHeight)*0.8;
        state.x = vw/2 - (img.naturalWidth/2*state.scale); state.y = vh/2 - (img.naturalHeight/2*state.scale);
        requestRender();
    }

    vNode.addEventListener('pointerdown', e => { vNode.setPointerCapture(e.pointerId); pointers.push(e); if(pointers.length === 1) lastPoint = { x: e.clientX, y: e.clientY }; else if(pointers.length === 2) lastDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY); });
    vNode.addEventListener('pointermove', e => {
        const idx = pointers.findIndex(p => p.pointerId === e.pointerId); if(idx === -1) return; pointers[idx] = e;
        if(pointers.length === 1 && lastPoint) { state.x += e.clientX - lastPoint.x; state.y += e.clientY - lastPoint.y; lastPoint = { x: e.clientX, y: e.clientY }; state.isTracking = false; } 
        else if(pointers.length === 2) { const midX = (pointers[0].clientX + pointers[1].clientX) / 2, midY = (pointers[0].clientY + pointers[1].clientY) / 2, dist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY), zoom = dist / lastDist; state.scale *= zoom; state.x = midX - (midX - state.x) * zoom; state.y = midY - (midY - state.y) * zoom; lastDist = dist; state.isTracking = false; }
        requestRender();
    });
    const endPointer = e => { pointers = pointers.filter(p => p.pointerId !== e.pointerId); if(pointers.length < 2) lastDist = 0; if(pointers.length === 0) lastPoint = null; };
    vNode.addEventListener('pointerup', endPointer); vNode.addEventListener('pointercancel', endPointer);

    function requestRender() { if(!ticking) { window.requestAnimationFrame(() => { render(); ticking = false; }); ticking = true; } }
    
    function render() {
        const vw = vNode.clientWidth, vh = vNode.clientHeight;
        const rot = (state.rotateMode === 1) ? -state.mapNorth : (state.rotateMode === 2) ? -state.mapNorth - state.userHeading : 0;
        const rad = rot * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad), sx = vw / 2, sy = (state.rotateMode === 2) ? vh * 0.7 : vh / 2;
        if(state.isTracking && state.userPos.x){ state.x = sx - (state.userPos.x * state.scale * cos - state.userPos.y * state.scale * sin); state.y = sy - (state.userPos.x * state.scale * sin + state.userPos.y * state.scale * cos); } 
        container.style.transform = `translate(${state.x}px, ${state.y}px) rotate(${rot}deg) scale(${state.scale})`;
        if(state.metersPerPixel) { el('scale-bar-container').style.display = 'flex'; const totalMeters = 100 * (state.metersPerPixel / state.scale); el('scale-label').innerText = totalMeters >= 1000 ? (totalMeters/1000).toFixed(2)+"km" : Math.round(totalMeters)+"m"; }
        const uContainer = el('user-container');
        if(state.userPos.x){
            const ux = state.x + (state.userPos.x * state.scale * cos - state.userPos.y * state.scale * sin), uy = state.y + (state.userPos.x * state.scale * sin + state.userPos.y * state.scale * cos);
            uContainer.style.left = ux + 'px'; uContainer.style.top = uy + 'px'; uContainer.style.display = 'block';
            el('user-dot-wrapper').style.transform = `translate(-50%, -50%) rotate(${state.userHeading + state.mapNorth + rot}deg)`;
        }
    }

    function saveAndStart() { showStep(4); el('ui-overlay').style.display='flex'; navigator.geolocation.watchPosition(p => { if(p.coords.accuracy>35)return; state.userAcc=p.coords.accuracy; state.userPos={x:state.p1.x+(p.coords.longitude-state.p1.lng)/(state.p2.lng-state.p1.lng)*(state.p2.x-state.p1.x), y:state.p1.y+(p.coords.latitude-state.p1.lat)/(state.p2.lat-state.p1.lat)*(state.p2.y-state.p1.y)}; el('status').innerHTML=`精度: &plusmn;${Math.round(state.userAcc)}m`; requestRender(); }, null, {enableHighAccuracy:true}); }
    function exitApp() { haptic(); location.reload(); }
    function toggleTracking(){ haptic(); state.isTracking=!state.isTracking; requestRender(); }
    function cycleRotateMode(){ haptic(); state.rotateMode=(state.rotateMode+1)%3; el('btn-rotate').innerText=['🧭','⬆️N','🏃⬆️'][state.rotateMode]; requestRender(); }
    async function askGyro(){ if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){ if(await DeviceOrientationEvent.requestPermission() !== 'granted') return; } window.addEventListener('deviceorientation', e => { state.userHeading = e.webkitCompassHeading || (360 - e.alpha); requestRender(); }, true); el('gyro-btn').style.display = 'none'; }
</script>
</body>
