<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Map Tracker Pro v25.1</title>
    <!-- 外部ライブラリ：QR生成・スキャン -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root { 
            --bg: #0f172a; --panel-bg: rgba(30, 41, 59, 0.95); --accent: #3b82f6; 
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.2);
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100dvh; width: 100%; position: fixed; }
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #000; }
        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
        #map-img { display: none; pointer-events: none; }
        
        /* ユーザー & 同期アイコン */
        #user-node { position: absolute; pointer-events: none; z-index: 1100; display: none; }
        #user-dot { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 24px solid var(--accent); transform: translate(-50%, -70%); }
        .cursor-other { position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; background: var(--danger); transform: translate(-50%, -50%); z-index: 1050; }
        .cursor-label { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; background: rgba(0,0,0,0.7); padding: 2px 4px; border-radius: 4px; white-space: nowrap; }

        /* パネル */
        #panel { position: fixed; bottom: 20px; left: 15px; right: 15px; padding: 20px; background: var(--panel-bg); backdrop-filter: blur(20px); border-radius: 24px; z-index: 2000; border: 1px solid var(--glass-border); max-height: 80dvh; overflow-y: auto; }
        .step { display: none; } .active { display: block; }
        button { width: 100%; padding: 16px; margin: 6px 0; border-radius: 14px; border: none; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .blue { background: var(--accent); color: white; }
        .outline { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: white; }

        /* 座標入力 */
        .coord-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .coord-row input { background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 18px; }
        .int-input { width: 80px; text-align: right; }
        .dec-input { flex: 1; }

        /* 右上UI */
        #ui-overlay { position: fixed; top: 50px; right: 15px; display: none; flex-direction: column; gap: 12px; z-index: 2001; }
        .ui-btn { width: 52px; height: 52px; background: var(--panel-bg); color: white; border-radius: 14px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 26px; }

        /* QR & 同期セクション */
        #qr-reader-video { width: 100%; border-radius: 12px; display: none; margin-bottom: 10px; }
        #qrcode-display { background: white; padding: 10px; border-radius: 10px; display: inline-block; }
    </style>
</head>
<body>

<div id="viewport">
    <div id="map-container"><img id="map-img"></div>
    <div id="sync-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></div>
    <div id="user-node"><div id="user-dot"></div></div>
</div>

<div id="ui-overlay">
    <div id="btn-lock" class="ui-btn" onclick="toggleTracking()">🎯</div>
    <div id="btn-share" class="ui-btn" onclick="showStep('s-sync')">📡</div>
</div>

<div id="panel">
    <div id="s0" class="step active">
        <h2 style="text-align:center;">Map Tracker Pro</h2>
        <button class="blue" onclick="pickImage()">＋ マップ作成</button>
    </div>

    <div id="s2" class="step">
        <p id="guide" style="font-weight:bold; color:var(--accent);">P1の座標を入力</p>
        <div class="coord-row">
            <input type="number" id="lat_i" class="int-input" placeholder="35"><span>.</span><input type="number" id="lat_d" class="dec-input" placeholder="0000">
        </div>
        <div class="coord-row">
            <input type="number" id="lng_i" class="int-input" placeholder="135"><span>.</span><input type="number" id="lng_d" class="dec-input" placeholder="0000">
        </div>
        <button class="blue" id="cal-btn" onclick="processCalib()">P1確定</button>
    </div>

    <div id="s-sync" class="step">
        <h3 style="text-align:center;">📡 チーム共有</h3>
        <input type="text" id="uname" placeholder="あなたの表示名" style="width:100%; padding:14px; margin-bottom:10px; border-radius:12px; background:#000; border:1px solid #444; color:white; box-sizing:border-box;">
        
        <div id="sync-initial">
            <button class="blue" onclick="startHost()">グループを作成 (QR発行)</button>
            <button class="outline" onclick="startScanner()">参加する (QRスキャン)</button>
        </div>

        <div id="sync-host" style="display:none; text-align:center;">
            <p>このQRを仲間に読み取らせてください</p>
            <div id="qrcode-display"></div>
            <p id="host-id-text" style="font-family:monospace; margin-top:10px;"></p>
        </div>

        <div id="sync-scan" style="display:none; text-align:center;">
            <video id="qr-reader-video" playsinline></video>
            <p>QRコードを枠内に収めてください</p>
        </div>

        <button class="outline" onclick="showStep(4)" style="margin-top:10px;">閉じる</button>
    </div>

    <div id="s4" class="step">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <div id="status-gps" style="font-size:14px; font-weight:bold;">GPS接続中...</div>
                <div id="status-group" style="font-size:10px; color:var(--accent);"></div>
            </div>
            <button class="outline" onclick="location.reload()" style="width:auto; margin:0; padding:10px 15px;">終了</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const fbConfig = {
        apiKey: "AIzaSyDKPvOcJ0y79_7_oVW0KF8YR0iKcF4o_cc",
        authDomain: "tac-map-multi.firebaseapp.com",
        databaseURL: "https://tac-map-multi-default-rtdb.firebaseio.com",
        projectId: "tac-map-multi",
        appId: "1:530840369600:web:88b595c9789acd54b4b025"
    };

    const fbApp = initializeApp(fbConfig);
    const db = getDatabase(fbApp);
    const myId = Math.random().toString(36).substring(7).toUpperCase();
    let gid = null;

    // --- ホスト開始 ---
    window.startHost = () => {
        gid = "G-" + Math.random().toString(36).substring(7).toUpperCase();
        document.getElementById('sync-initial').style.display = 'none';
        document.getElementById('sync-host').style.display = 'block';
        document.getElementById('qrcode-display').innerHTML = "";
        new QRCode(document.getElementById("qrcode-display"), { text: gid, width: 160, height: 160 });
        document.getElementById('host-id-text').innerText = "ID: " + gid;
        initSync();
    };

    // --- スキャナー開始 ---
    window.startScanner = async () => {
        const video = document.getElementById('qr-reader-video');
        video.style.display = 'block';
        document.getElementById('sync-initial').style.display = 'none';
        document.getElementById('sync-scan').style.display = 'block';
        
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.play();

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        const tick = () => {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code) {
                    gid = code.data;
                    stream.getTracks().forEach(t => t.stop());
                    video.style.display = 'none';
                    initSync();
                    showStep(4);
                    return;
                }
            }
            if(document.getElementById('sync-scan').style.display !== 'none') requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
    };

    function initSync() {
        if(!gid) return;
        document.getElementById('status-group').innerText = `Group: ${gid}`;
        onDisconnect(ref(db, `groups/${gid}/u/${myId}`)).remove();
        onValue(ref(db, `groups/${gid}/u`), (snap) => {
            const users = snap.val();
            const layer = document.getElementById('sync-layer');
            layer.innerHTML = '';
            if(!users || !window.state.p1) return;
            Object.keys(users).forEach(id => {
                if(id === myId) return;
                const u = users[id];
                const dot = document.createElement('div');
                dot.className = 'cursor-other';
                const pos = worldToScreen(u.x, u.y);
                dot.style.left = pos.x + 'px';
                dot.style.top = pos.y + 'px';
                dot.innerHTML = `<div class="cursor-label">${u.n}</div>`;
                layer.appendChild(dot);
            });
        });
    }

    setInterval(() => {
        if(gid && window.state.userPos.x) {
            update(ref(db, `groups/${gid}/u/${myId}`), {
                x: window.state.userPos.x, y: window.state.userPos.y,
                n: document.getElementById('uname').value || "Noname", t: Date.now()
            });
        }
    }, 1000);

    function worldToScreen(wx, wy) {
        return { x: window.state.x + wx * window.state.scale, y: window.state.y + wy * window.state.scale };
    }
</script>

<script>
    // コア・ロジック (v21.7ベース改)
    let state = { x:0, y:0, scale:1, p1:null, p2:null, userPos:{x:0,y:0}, isTracking:true };
    window.state = state;
    const view = document.getElementById('viewport'), container = document.getElementById('map-container');

    function showStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        const target = (typeof n === 'string') ? document.getElementById(n) : document.getElementById('s'+n);
        target.classList.add('active');
        if(n === 's-sync') {
            document.getElementById('sync-initial').style.display = 'block';
            document.getElementById('sync-host').style.display = 'none';
            document.getElementById('sync-scan').style.display = 'none';
        }
    }

    function pickImage() {
        const input = document.createElement('input'); input.type = 'file';
        input.onchange = e => {
            const file = e.target.files[0];
            const img = document.getElementById('map-img');
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                img.style.display = 'block';
                state.scale = Math.min(view.clientWidth / img.naturalWidth, view.clientHeight / img.naturalHeight);
                showStep(2); render();
            }
        }; input.click();
    }

    function processCalib() {
        const lat = parseFloat(document.getElementById('lat_i').value + "." + document.getElementById('lat_d').value);
        const lng = parseFloat(document.getElementById('lng_i').value + "." + document.getElementById('lng_d').value);
        const centerX = (view.clientWidth/2 - state.x) / state.scale;
        const centerY = (view.clientHeight/2 - state.y) / state.scale;
        if(!state.p1) {
            state.p1 = { x: centerX, y: centerY, lat, lng };
            document.getElementById('guide').innerText = "P2の座標を入力";
            document.getElementById('cal-btn').innerText = "P2確定";
            document.getElementById('lat_i').value = ""; document.getElementById('lat_d').value = "";
        } else {
            state.p2 = { x: centerX, y: centerY, lat, lng };
            initGPS();
        }
    }

    function initGPS() {
        showStep(4);
        document.getElementById('ui-overlay').style.display = 'flex';
        navigator.geolocation.watchPosition(p => {
            const lat = p.coords.latitude, lng = p.coords.longitude;
            state.userPos = {
                x: state.p1.x + (lng - state.p1.lng) / (state.p2.lng - state.p1.lng) * (state.p2.x - state.p1.x),
                y: state.p1.y + (lat - state.p1.lat) / (state.p2.lat - state.p1.lat) * (state.p2.y - state.p1.y)
            };
            document.getElementById('status-gps').innerText = `精度: ±${Math.round(p.coords.accuracy)}m`;
            render();
        }, null, { enableHighAccuracy: true });
    }

    function render() {
        if(state.isTracking && state.userPos.x) {
            state.x = view.clientWidth/2 - state.userPos.x * state.scale;
            state.y = view.clientHeight/2 - state.userPos.y * state.scale;
        }
        container.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
        if(state.userPos.x) {
            const u = document.getElementById('user-node');
            u.style.display = 'block';
            u.style.left = (state.x + state.userPos.x * state.scale) + 'px';
            u.style.top = (state.y + state.userPos.y * state.scale) + 'px';
        }
    }

    function toggleTracking() { state.isTracking = !state.isTracking; render(); }

    let lastP = null;
    view.addEventListener('touchstart', e => { if(e.touches.length===1) lastP = {x:e.touches[0].clientX, y:e.touches[0].clientY}; });
    view.addEventListener('touchmove', e => {
        if(e.touches.length===1 && lastP) {
            state.x += e.touches[0].clientX - lastP.x; state.y += e.touches[0].clientY - lastP.y;
            lastP = {x:e.touches[0].clientX, y:e.touches[0].clientY};
            state.isTracking = false; render();
        }
    });
</script>
</body>
</html>
