<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>読込テスト</title>
</head>
<body style="background:#000; color:#fff; text-align:center; padding-top:50px;">
    <div id="log" style="font-size:18px;">読み込みを開始します...</div>

    <script type="module">
        const log = document.getElementById('log');
        
        // タイムアウト設定（15秒待っても終わらなければエラーにする）
        const timer = setTimeout(() => {
            log.innerText = "エラー: 読み込みがタイムアウトしました。通信環境を確認してください。";
            log.style.color = "red";
        }, 15000);

        try {
            // インポート自体を動的に実行し、成功を検知する
            const { Hands } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js");
            clearTimeout(timer);
            log.innerText = "読み込み成功！AIモデルの準備が完了しました。";
            log.style.color = "#00FF00";
        } catch (err) {
            clearTimeout(timer);
            log.innerText = "読み込み失敗: " + err.message;
            log.style.color = "red";
        }
    </script>
</body>
</html>
