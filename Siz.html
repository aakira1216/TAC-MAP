<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指先計測システム</title>
    <style>
        body { margin: 0; background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        #log { padding: 20px; font-size: 18px; color: #00FF00; }
        
        /* ベースコードの構造を守りつつ、ボタンを画像上に浮かせます */
        #container { position: relative; }
        #webcam { width: 100%; height: auto; display: block; }
        
        #start-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; background: #007bff; color: white; 
            border: none; border-radius: 10px; cursor: pointer; display: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="log">AIモデルを読み込み中...</div>
    <div id="container">
        <button id="start-btn">カメラを起動して計測開始</button>
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script type="module">
        const log = document.getElementById('log');
        const btn = document.getElementById('start-btn');
        const video = document.getElementById('webcam');

        // ベースコードのAI読み込み処理（維持）
        try {
            const { Hands } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js");
            log.innerText = "読み込み成功！AIモデルの準備が完了しました。";
            btn.style.display = "inline-block";
        } catch (err) {
            log.innerText = "読み込み失敗: " + err.message;
        }

        // ベースコードのカメラ起動処理（維持）
        btn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                log.innerText = "カメラ起動成功！準備完了です。";
                btn.style.display = "none";
                
                // ここに「計測開始」のロジックを積み上げます
                console.log("計測待機状態");
            } catch (err) {
                log.innerText = "カメラエラー: " + err.message;
            }
        };
    </script>
</body>
</html>
