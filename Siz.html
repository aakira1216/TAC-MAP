<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>指先計測システム</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        #log { padding: 20px; color: #fff; }
        #start-btn { padding: 20px 40px; font-size: 20px; background: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; }
        #webcam { width: 100%; height: auto; display: block; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: auto; }
    </style>
</head>
<body>
    <div id="log">モデル読み込み中...お待ちください</div>
    <button id="start-btn" style="display:none;">計測を開始</button>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script type="module">
        // 外部からライブラリがロードされたか確認する関数
        const checkLibrary = setInterval(() => {
            if (window.Hands) {
                clearInterval(checkLibrary);
                document.getElementById('log').innerText = "準備完了！";
                document.getElementById('start-btn').style.display = "inline-block";
            }
        }, 500);

        const btn = document.getElementById('start-btn');
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');

        btn.onclick = async () => {
            btn.style.display = "none";
            // カメラ起動
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            
            // AI初期化
            const hands = new window.Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });
            
            hands.onResults((results) => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (results.multiHandLandmarks) {
                    for (const landmarks of results.multiHandLandmarks) {
                        const pt = landmarks[8];
                        ctx.fillStyle = '#00FF00';
                        ctx.beginPath();
                        ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 20, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                }
            });

            async function detect() {
                await hands.send({image: video});
                requestAnimationFrame(detect);
            }
            detect();
        };
    </script>
</body>
</html>
