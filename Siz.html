<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指先計測システム</title>
    <style>
        body { margin: 0; background: #000; }
        #container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
        
        /* フローティングボタン */
        #start-btn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 20px; background: rgba(0, 123, 255, 0.9); 
            color: white; border: none; border-radius: 10px; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <button id="start-btn">計測を開始</button>
    </div>

    <script>
        // 1. ページ読み込み時にカメラをプレビュー
        const video = document.getElementById('webcam');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error("カメラ許可が必要です"); });

        // 2. ボタンを押した時だけ計測ロジックを読み込む
        const btn = document.getElementById('start-btn');
        btn.onclick = () => {
            btn.innerText = "解析準備中...";
            // ここから先で計測ロジックを統合していきます
            alert("ここに計測ロジックを統合します");
        };
    </script>
</body>
</html>
