<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body id="body">
    <h1 id="status">JavaScript未起動</h1>
    <button id="test-btn" style="padding: 30px; font-size: 20px;">タップして起動</button>

    <script>
        // ページが読み込まれた瞬間に実行
        document.getElementById('status').innerText = "JavaScript起動中";
        document.getElementById('body').style.backgroundColor = "#ffcccc"; // 赤系にする

        // ボタンのクリックイベント
        document.getElementById('test-btn').onclick = () => {
            document.getElementById('status').innerText = "タップ成功！カメラを探しています...";
            
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    document.getElementById('status').innerText = "カメラ起動成功！";
                    document.getElementById('body').style.backgroundColor = "#ccffcc"; // 緑にする
                })
                .catch(err => {
                    document.getElementById('status').innerText = "エラー: " + err.name;
                });
        };
    </script>
</body>
</html>
