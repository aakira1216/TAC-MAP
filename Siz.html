<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>指先トラッキング</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; }
        .container { position: relative; width: 100vw; max-width: 640px; }
        #webcam { width: 100%; display: block; transform: scaleX(-1); } /* 鏡合わせにする */
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; transform: scaleX(-1); }
    </style>
</head>
<body>

<div class="container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
</div>

<script type="module">
    import { Hands } from "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5 });

    hands.onResults((results) => {
        // キャンバスサイズをビデオに合わせる
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (results.multiHandLandmarks) {
            for (const landmarks of results.multiHandLandmarks) {
                // 人差し指の先端 (Index Finger Tip) はインデックス 8
                const fingerTip = landmarks[8];
                const x = fingerTip.x * canvas.width;
                const y = fingerTip.y * canvas.height;

                // 描画
                ctx.fillStyle = '#00FF00';
                ctx.beginPath();
                ctx.arc(x, y, 10, 0, 2 * Math.PI);
                ctx.fill();

                // 座標を表示
                ctx.font = "30px Arial";
                ctx.fillText(`X:${Math.round(x)} Y:${Math.round(y)}`, x + 20, y);
            }
        }
    });

    // カメラ起動
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then((stream) => {
        video.srcObject = stream;
        async function detect() {
            await hands.send({image: video});
            requestAnimationFrame(detect);
        }
        detect();
    });
</script>
</body>
</html>
