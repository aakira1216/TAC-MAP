<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指先計測システム v1.1</title>
    <style>
        body { margin: 0; background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        #log { padding: 20px; font-size: 18px; color: #00FF00; }
        #start-btn { padding: 20px 40px; font-size: 20px; background: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; display: none; }
        #webcam { width: 100%; height: auto; display: block; }
        
        /* 追加パッチ：フローティング計測開始ボタン */
        #measure-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            z-index: 10;
        }
        #video-container { position: relative; }
    </style>
</head>
<body>
    <div id="log">AIモデルを読み込み中...</div>
    <button id="start-btn">カメラを起動して計測開始</button>
    
    <div id="video-container">
        <button id="measure-btn">計測開始</button>
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script type="module">
        const log = document.getElementById('log');
        const btn = document.getElementById('start-btn');
        const measureBtn = document.getElementById('measure-btn');
        const video = document.getElementById('webcam');

        // 1. AIモデルの読み込み
        try {
            const { Hands } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js");
            log.innerText = "読み込み成功！AIモデルの準備が完了しました。";
            btn.style.display = "inline-block"; // ここでボタンを表示！
        } catch (err) {
            log.innerText = "読み込み失敗: " + err.message;
        }

        // 2. ボタンを押したらカメラ起動
        btn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                log.innerText = "カメラ起動成功！準備完了です。";
                btn.style.display = "none";
                
                // フローティングボタンを表示
                measureBtn.style.display = "inline-block";
            } catch (err) {
                log.innerText = "カメラエラー: " + err.message;
            }
        };

        // 追加パッチ：計測ボタンのトリガー
        measureBtn.onclick = () => {
            log.innerText = "計測を開始しました（機能実装待ち）";
            measureBtn.style.display = "none";
        };
    </script>
</body>
</html>
