<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指先計測システム</title>
    <style>
        body { margin: 0; background: #000; color: #fff; text-align: center; font-family: sans-serif; }
        
        /* 映像コンテナ */
        #container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #webcam { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* 1. カメラ起動ボタン（初期表示） */
        #init-btn { padding: 20px 40px; font-size: 20px; background: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 50px; }
        
        /* 2. 計測開始ボタン（フローティング） */
        #measure-btn { 
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; font-size: 18px; background: rgba(0, 200, 0, 0.8); 
            color: white; border: none; border-radius: 10px; z-index: 100; display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <button id="init-btn">カメラを起動</button>
        <video id="webcam" autoplay playsinline></video>
        
        <button id="measure-btn">計測を開始</button>
    </div>

    <script type="module">
        import { Hands } from "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";

        const initBtn = document.getElementById('init-btn');
        const measureBtn = document.getElementById('measure-btn');
        const video = document.getElementById('webcam');

        // 1. カメラ起動フロー
        initBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
            initBtn.style.display = "none"; // カメラ起動後に初期ボタンは消す
            measureBtn.style.display = "block"; // フローティング計測ボタンを表示
        };

        // 2. 計測開始フロー（フローティングボタン）
        measureBtn.onclick = async () => {
            measureBtn.innerText = "計測中...";
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });
            
            hands.onResults((results) => {
                // ここに計測結果の描画ロジックを配置
                console.log("座標取得中");
            });

            async function detect() {
                await hands.send({image: video});
                requestAnimationFrame(detect);
            }
            detect();
        };
    </script>
</body>
</html>
