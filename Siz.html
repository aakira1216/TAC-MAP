<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指先トラッキング・完全版</title>
    <style>
        /* 画面全体に黒背景で、要素を中央に配置 */
        body { margin: 0; background: #000; color: #fff; text-align: center; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* カメラ映像と描画キャンバスを重ねるコンテナ */
        .container { position: relative; width: 100%; height: 100%; }
        
        /* カメラ映像（背面カメラ） */
        #webcam { width: 100%; height: 100%; object-fit: cover; display: none; } /* 起動前は隠す */
        
        /* AIによる描画用キャンバス（映像の上に重ねる） */
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* 起動ボタン */
        #start-btn { position: absolute; z-index: 20; padding: 20px 40px; font-size: 20px; background-color: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* ローディング中などのメッセージ */
        #status { position: absolute; top: 10px; width: 100%; text-align: center; font-size: 14px; z-index: 10; color: #ffeb3b; }
    </style>
</head>
<body>

<div class="container">
    <div id="status"></div>
    <button id="start-btn">カメラを起動して計測開始</button>
    
    <video id="webcam" autoplay playsinline></video>
    
    <canvas id="output_canvas"></canvas>
</div>

<script type="module">
    // CDNからMediaPipe Handsをインポート
    import { Hands } from "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('start-btn');
    const status = document.getElementById('status');

    // ボタンをクリックした時の処理
    btn.onclick = async () => {
        btn.style.display = "none"; // ボタンを隠す
        status.innerText = "カメラとAIを起動中...";

        try {
            // 1. 背面カメラ（environment）を指定してストリームを取得
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' } 
            });
            video.srcObject = stream;
            video.style.display = "block"; // 映像を表示

            // 2. MediaPipe Handsの初期化
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            // 3. AIのオプション設定（手は1本、精度優先）
            hands.setOptions({ 
                maxNumHands: 1, 
                modelComplexity: 1, 
                minDetectionConfidence: 0.5, 
                minTrackingConfidence: 0.5 
            });

            // 4. AIが認識した結果を受け取る処理（描画ロジック）
            hands.onResults((results) => {
                // キャンバスのサイズをカメラ映像に合わせる
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                // 一度キャンバスをクリア
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // もし手（骨格データ）が見つかったら
                if (results.multiHandLandmarks) {
                    for (const landmarks of results.multiHandLandmarks) {
                        // 【ここが核心！】人差し指の先端（Index Finger Tip）はインデックス番号「8」
                        const fingerTip = landmarks[8];

                        // 座標(x, y)は0〜1で来るので、実際のキャンバスサイズに変換
                        const x = fingerTip.x * canvas.width;
                        const y = fingerTip.y * canvas.height;

                        // --- 描画：指先に緑の丸を出す ---
                        ctx.fillStyle = '#00FF00'; // 緑色
                        ctx.beginPath();
                        // 座標(x, y)に、半径10の丸を描く
                        ctx.arc(x, y, 15, 0, 2 * Math.PI); 
                        ctx.fill();

                        // --- 描画：座標の数値をテキスト表示（デバッグ用） ---
                        ctx.fillStyle = 'white';
                        ctx.font = "30px Arial";
                        ctx.fillText(`X:${Math.round(x)} Y:${Math.round(y)}`, x + 30, y);
                    }
                }
            });

            // 5. カメラ映像をAIに送り続ける無限ループ関数
            async function detect() {
                if (!video.videoWidth) { // 映像がまだ準備できていなければ待つ
                    await new Promise(requestAnimationFrame);
                    detect();
                    return;
                }
                status.innerText = ""; // メッセージを消す
                await hands.send({image: video}); // 映像をMediaPipeに送る
                requestAnimationFrame(detect); // 次のフレームへ
            }
            detect(); // ループ開始

        } catch (err) {
            status.innerText = "エラー: " + err.message;
            status.style.color = "red";
            console.error("起動失敗:", err);
            btn.style.display = "block"; // エラーならボタンを戻す
        }
    };
</script>
</body>
</html>
