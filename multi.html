<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Tactical Offline Map v22.1 Full-Integrated</title>
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
      }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: #0f0; }
        #map-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #map-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
        
        /* Tactical HUD (Right) */
        .ui-overlay {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 20px; z-index: 100;
        }
        .hud-btn {
            width: 55px; height: 55px; border-radius: 50%; background: rgba(0, 40, 0, 0.85);
            border: 2px solid #0f0; color: #0f0; font-size: 26px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }

        /* Coordinate Panel (v21.7 Fixed) */
        .coord-panel {
            position: absolute; bottom: 15px; left: 15px; background: rgba(0, 20, 0, 0.9);
            padding: 12px; border: 1px solid #0f0; display: flex; gap: 8px; align-items: center; z-index: 100;
        }
        .coord-input { width: 65px; background: #000; border: 1px solid #0f0; color: #0f0; text-align: center; font-size: 16px; padding: 4px; }
        .coord-dec { width: 85px; }

        /* Shared Panel (v22.1) */
        #shared-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 340px; background: rgba(0, 15, 0, 0.98); border: 2px solid #0f0;
            padding: 20px; display: none; z-index: 2000; box-shadow: 0 0 30px #000;
        }
        .panel-header { font-weight: bold; border-bottom: 1px solid #0f0; margin-bottom: 15px; padding-bottom: 8px; text-align: center; letter-spacing: 2px; }
        #qrcode { background: #fff; padding: 10px; margin: 15px auto; width: 128px; height: 128px; border: 2px solid #0f0; }
        .btn-action { width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; background: #030; color: #0f0; border: 1px solid #0f0; font-weight: bold; }
        .btn-danger { background: #411; border-color: #f33; color: #f33; }

        /* Failure Lock Screen */
        #failure-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(40, 0, 0, 0.95); color: #f00; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; font-size: 4rem; font-weight: bold; text-align: center;
        }

        /* Scale Bar & Status */
        #scale-bar { position: absolute; left: 20px; top: 20px; border-left: 3px solid #0f0; padding: 5px 10px; background: rgba(0, 20, 0, 0.6); }
        .skin-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
    </style>
</head>
<body>

<div id="map-container">
    <canvas id="map-canvas"></canvas>
    <div id="skin-layer" class="skin-overlay"></div>
    
    <div id="scale-bar">50m | ————————</div>

    <div class="ui-overlay">
        <button class="hud-btn" id="btn-follow" onclick="toggleFollow()">🎯</button>
        <button class="hud-btn" id="btn-rotate" onclick="toggleRotate()">🧭</button>
        <button class="hud-btn" id="btn-share" onclick="toggleSharedPanel()">📡</button>
    </div>

    <!-- v21.7 Fixed Split Input -->
    <div class="coord-panel">
        LAT <input type="number" id="lat_int" class="coord-input" value="35">.<input type="number" id="lat_dec" class="coord-input coord-dec" value="68123">
        LON <input type="number" id="lng_int" class="coord-input" value="139">.<input type="number" id="lng_dec" class="coord-input coord-dec" value="76673">
        <button onclick="syncMap()" style="background:#0f0; color:#000; border:none; padding:5px 15px; font-weight:bold; cursor:pointer;">SYNC</button>
    </div>

    <!-- Shared HUD -->
    <div id="shared-panel">
        <div class="panel-header">TACTICAL SHARED NET</div>
        <div style="font-size: 0.7rem; color: #8f8;">SESSION ID: <span id="my-ephemeral-id">----</span></div>
        <input type="text" id="callsign" placeholder="CALLSIGN (ID)" maxlength="10" style="width:94%; background:#000; color:#0f0; border:1px solid #0f0; padding:8px; margin-top:10px;">
        
        <div id="qrcode"></div>
        
        <div id="member-list" style="max-height: 120px; overflow-y: auto; font-size: 0.9rem; margin: 10px 0; border: 1px dashed #060; padding: 5px;"></div>
        
        <button class="btn-action" onclick="setAsLeader()">大将（リーダー）に指定</button>
        <button class="btn-action btn-danger" onclick="cleanupAndExit()">戦域離脱 (全抹消)</button>
        <button class="btn-action" onclick="toggleSharedPanel()">閉じる</button>
    </div>
</div>

<div id="failure-screen">
    <div>MISSION FAILED</div>
    <div style="font-size: 1.5rem; margin-top: 30px;">リーダーが離脱または活動を停止しました。</div>
</div>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getDatabase, ref, set, onValue, remove, onDisconnect } from "firebase/database";

    // --- Firebase Configuration ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- State Management ---
    const TacticalNet = {
        myId: crypto.randomUUID().split('-')[0],
        roomId: new URLSearchParams(window.location.search).get('room') || 'HUB_01',
        isLeader: false,
        members: {}
    };

    const state = {
        lat: 35.68123, lng: 139.76673, // 現在のGPS位置
        mapLat: 35.68123, mapLng: 139.76673, // 同期基準点
        scale: 1.0, rotation: 0,
        isFollowing: true, isRotating: false,
        img: new Image()
    };
    state.img.src = 'map.jpg';

    document.getElementById('my-ephemeral-id').innerText = TacticalNet.myId;
    new QRCode(document.getElementById("qrcode"), {
        text: window.location.href.split('?')[0] + "?room=" + TacticalNet.myId,
        width: 128, height: 128
    });

    const canvas = document.getElementById('map-canvas');
    const ctx = canvas.getContext('2d');

    // --- Coordinate Conversion Logic (v21.7+ Core) ---
    // 1ピクセルあたりの緯度経度変化量（50mスケール基準）
    const degPerPixel = 0.0000009; 

    function worldToScreen(targetLat, targetLng) {
        const dLat = (state.mapLat - targetLat) / degPerPixel;
        const dLng = (targetLng - state.mapLng) / degPerPixel;
        
        // 中心点からの相対位置
        let x = canvas.width / 2 + dLng * state.scale;
        let y = canvas.height / 2 + dLat * state.scale;

        // 回転処理（回転モード時）
        if (state.isRotating) {
            const rad = -state.rotation * Math.PI / 180;
            const rx = (x - canvas.width / 2) * Math.cos(rad) - (y - canvas.height / 2) * Math.sin(rad);
            const ry = (x - canvas.width / 2) * Math.sin(rad) + (y - canvas.height / 2) * Math.cos(rad);
            x = rx + canvas.width / 2;
            y = ry + canvas.height / 2;
        }
        return { x, y };
    }

    // --- Firebase Network Functions ---
    function updateCloud() {
        const myRef = ref(db, `rooms/${TacticalNet.roomId}/members/${TacticalNet.myId}`);
        const data = {
            id: TacticalNet.myId,
            callsign: document.getElementById('callsign').value || 'UNIT',
            lat: state.lat, lng: state.lng,
            role: TacticalNet.isLeader ? "leader" : "member",
            status: "active",
            time: Date.now()
        };
        set(myRef, data);
        if (TacticalNet.isLeader) {
            set(ref(db, `rooms/${TacticalNet.roomId}/public_leader`), data);
        }
        onDisconnect(myRef).remove();
    }

    onValue(ref(db, `rooms/${TacticalNet.roomId}/members`), (snapshot) => {
        TacticalNet.members = snapshot.val() || {};
        const list = document.getElementById('member-list');
        list.innerHTML = Object.values(TacticalNet.members).map(m => 
            `<div>[${m.role === 'leader' ? '★' : ' '}] ${m.callsign}</div>`
        ).join('');

        // 大将陥落チェック
        Object.values(TacticalNet.members).forEach(m => {
            if (m.role === 'leader' && m.status === 'retired') {
                document.getElementById('failure-screen').style.display = 'flex';
            }
        });
    });

    // --- Interaction Logic ---
    window.syncMap = () => {
        state.mapLat = parseFloat(document.getElementById('lat_int').value + "." + document.getElementById('lat_dec').value);
        state.mapLng = parseFloat(document.getElementById('lng_int').value + "." + document.getElementById('lng_dec').value);
        updateCloud();
    };

    window.toggleFollow = () => {
        state.isFollowing = !state.isFollowing;
        document.getElementById('btn-follow').style.boxShadow = state.isFollowing ? "0 0 20px #0f0" : "none";
    };

    window.toggleRotate = () => {
        state.isRotating = !state.isRotating;
        document.getElementById('btn-rotate').style.boxShadow = state.isRotating ? "0 0 20px #0f0" : "none";
        if (!state.isRotating) state.rotation = 0;
    };

    window.toggleSharedPanel = () => {
        const p = document.getElementById('shared-panel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    };

    window.setAsLeader = () => {
        TacticalNet.isLeader = true;
        updateCloud();
    };

    window.cleanupAndExit = async () => {
        if (TacticalNet.isLeader) {
            await set(ref(db, `rooms/${TacticalNet.roomId}/members/${TacticalNet.myId}/status`), "retired");
        }
        await remove(ref(db, `rooms/${TacticalNet.roomId}/members/${TacticalNet.myId}`));
        window.location.href = window.location.pathname; 
    };

    // --- Main Loop ---
    function draw() {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // マップ背景描画
        const mapX = canvas.width / 2;
        const mapY = canvas.height / 2;
        
        ctx.translate(mapX, mapY);
        if (state.isRotating) ctx.rotate(-state.rotation * Math.PI / 180);
        ctx.scale(state.scale, state.scale);
        ctx.drawImage(state.img, -state.img.width / 2, -state.img.height / 2);
        ctx.restore();

        // 共有メンバー描画
        Object.values(TacticalNet.members).forEach(m => {
            if (m.id === TacticalNet.myId) return;
            const pos = worldToScreen(m.lat, m.lng);
            
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = (m.role === 'leader') ? '#f00' : '#0af';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.fillText(m.callsign, pos.x + 12, pos.y + 4);
        });

        // 自己位置カーソル
        const myPos = worldToScreen(state.lat, state.lng);
        ctx.beginPath();
        ctx.moveTo(myPos.x, myPos.y - 15);
        ctx.lineTo(myPos.x + 10, myPos.y + 10);
        ctx.lineTo(myPos.x - 10, myPos.y + 10);
        ctx.closePath();
        ctx.fillStyle = '#0f0';
        ctx.fill();

        requestAnimationFrame(draw);
    }

    // GPS擬似同期 (デモ用: 実際はNavigator.geolocationを使用)
    setInterval(() => {
        if (state.isFollowing) {
            updateCloud();
        }
    }, 3000);

    window.onload = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    };

    window.onresize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    };
</script>

</body>
</html>
