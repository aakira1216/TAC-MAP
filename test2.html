<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Map Tracker Pro v21.7</title>
    
    <!-- 共有用ライブラリ -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        /* --- v21.7 既存スタイルを完全維持 --- */
        :root { 
            --bg: #0f172a; --panel-bg: rgba(30, 41, 59, 0.9); --accent: #3b82f6; 
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1);
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100dvh; width: 100%; position: fixed; }
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #000; }
        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; z-index: 1; }
        #map-img { display: none; pointer-events: none; }
        
        #panel { position: fixed; bottom: 20px; left: 15px; right: 15px; padding: 15px; background: var(--panel-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; z-index: 2000; border: 1px solid var(--glass-border); }
        .step { display: none; } .active { display: block !important; }
        
        button { width: 100%; padding: 14px; margin: 5px 0; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; touch-action: manipulation; }
        .blue { background: var(--accent); color: white; } 
        .red { background: var(--danger); color: white; }
        .outline { background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.4); color: var(--text); }
        
        /* 座標分割入力 (v21.7 独自仕様) */
        .coord-row { display: flex; gap: 4px; align-items: center; margin-bottom: 5px; }
        .coord-row input { flex: 1; text-align: center; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 16px; }
        .coord-dot { font-weight: bold; color: var(--accent); }

        /* 右側ボタン配置 (初期状態 display: none を維持) */
        #ui-overlay { position: fixed; top: 60px; right: 15px; display: none; flex-direction: column; gap: 12px; z-index: 1002; }
        .ui-btn { width: 50px; height: 50px; background: var(--panel-bg); color: var(--text); border-radius: 12px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        
        /* 新設される共有ボタン (🎯の直下) */
        .ui-btn-tall { height: 100px; flex-direction: column; font-size: 20px; border: 2px solid var(--accent); }
        .ui-btn-tall span { font-size: 10px; font-weight: bold; margin-top: 4px; }

        /* 新設される設定ボックス (中央展開) */
        #team-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; background: var(--panel-bg); padding: 25px; border-radius: 24px; border: 2px solid var(--accent); z-index: 3500; box-shadow: 0 20px 60px rgba(0,0,0,0.8); backdrop-filter: blur(20px); }
    </style>
</head>
<body>

<div id="viewport">
    <div id="map-container"><img id="map-img"></div>
</div>

<!-- 右側ボタン列: マップ読み込み後に display: flex になる既存仕様を維持 -->
<div id="ui-overlay">
    <div class="ui-btn" onclick="toggleTracking()">🎯</div>
    <div class="ui-btn" onclick="cycleRotateMode()">🧭</div>
    <!-- 新設ボタン -->
    <div class="ui-btn ui-btn-tall" onclick="toggleTeamPanel()">📡<span>共有</span></div>
</div>

<div id="panel">
    <div id="s0" class="step active">
        <h3 style="margin:0 0 10px 0;color:var(--accent); font-size:18px;">Map Tracker Pro v21.7</h3>
        <button class="blue" onclick="startNewMap()">＋ 新規マップ読み込み</button>
        <button class="outline" onclick="showMapList()">📂 保存した地図から選ぶ</button>
        <!-- 新設メニューボタン -->
        <button class="outline" onclick="toggleTeamPanel()" style="border-color:var(--accent)">📡 チーム共有設定</button>
    </div>
    
    <div id="s2" class="step">
        <p id="guide" style="margin:0 0 10px 0; font-weight:bold;">地点1(P1)の座標を入力</p>
        <div id="p1-inputs">
            <div class="coord-row">
                <input type="number" id="lat1_int">.<input type="number" id="lat1_dec">
            </div>
            <div class="coord-row">
                <input type="number" id="lng1_int">.<input type="number" id="lng1_dec">
            </div>
            <button onclick="confirmP1()" class="red" style="background:var(--danger)">P1登録</button>
        </div>
    </div>
</div>

<!-- 新設: 独立した設定ボックス -->
<div id="team-panel">
    <h3 style="text-align:center; color:var(--accent); margin:0 0 15px 0;">📡 チーム共有設定</h3>
    <input type="text" id="share-name" placeholder="表示名">
    <input type="text" id="share-group" placeholder="グループID">
    <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="blue" onclick="startSharing()" style="flex:2;">同期開始</button>
        <button class="outline" onclick="toggleTeamPanel()" style="flex:1;">閉じる</button>
    </div>
</div>

<script>
    // --- v21.7 既存ロジックを完全維持 ---
    const el = id => document.getElementById(id);
    let state = { step: 0, scale: 1, x: 0, y: 0 };

    function showStep(n){ 
        document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); 
        if(el('s'+n)) el('s'+n).classList.add('active'); 
    }

    function startNewMap() { 
        const input = document.createElement('input'); input.type='file'; input.accept='image/*'; 
        input.onchange = e => { 
            const file = e.target.files[0]; if(!file) return;
            el('map-img').src = URL.createObjectURL(file);
            el('map-img').onload = () => { 
                el('map-img').style.display='block'; 
                // マップ読み込み後にのみ UI を表示する v21.7 の仕様を維持
                el('ui-overlay').style.display='flex';
                showStep(2); 
            };
        }; 
        input.click();
    }

    // --- 新設機能のみのロジック ---
    function toggleTeamPanel() { 
        const p = el('team-panel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }

    function startSharing() { alert("同期を開始します"); toggleTeamPanel(); }

    window.onload = () => { showStep(0); };
</script>
</body>
</html>
