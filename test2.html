<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Map Tracker Pro v21.7 - Stable</title>
    
    <!-- ライブラリ読み込みの不具合対策としてdeferを付与 -->
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { 
            --bg: #0f172a; --panel-bg: rgba(30, 41, 59, 0.9); --accent: #3b82f6; 
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1);
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100dvh; width: 100%; position: fixed; }
        
        /* 確実に見えるように z-index を調整 */
        #panel { position: fixed; bottom: 20px; left: 15px; right: 15px; padding: 15px; background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 20px; z-index: 9999; border: 1px solid rgba(255,255,255,0.1); }
        .step { display: none; } 
        .step.active { display: block !important; } /* 強制表示 */

        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
        
        button { width: 100%; padding: 14px; margin: 5px 0; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; color: white; }
        .blue { background: var(--accent); } 
        .outline { background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.4); color: var(--text); }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box; }

        /* UI Overlay 🎯の下に 📡 */
        #ui-overlay { position: fixed; top: 44px; right: 15px; display: none; flex-direction: column; gap: 12px; z-index: 1002; }
        .ui-btn { width: 50px; height: 50px; background: var(--panel-bg); color: var(--text); border-radius: 12px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .ui-btn-tall { width: 50px; height: 112px; flex-direction: column; font-size: 20px; }
        .ui-btn-tall span { font-size: 10px; font-weight: bold; margin-top: 4px; }

        #team-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; background: var(--panel-bg); padding: 20px; border-radius: 24px; border: 1px solid var(--accent); z-index: 10000; }
    </style>
</head>
<body>

<div id="viewport">
    <div id="map-container"><img id="map-img" style="display:none;"></div>
</div>

<div id="ui-overlay">
    <div class="ui-btn" onclick="toggleTracking()">🎯</div>
    <div class="ui-btn" onclick="cycleRotateMode()">🧭</div>
    <div class="ui-btn ui-btn-tall" onclick="toggleTeamPanel()">📡<span>共有</span></div>
</div>

<div id="panel">
    <!-- メインメニュー -->
    <div id="s0" class="step active">
        <h3 style="margin:0 0 10px 0; color:var(--accent);">Map Tracker Pro</h3>
        <button class="blue" onclick="startNewMap()">＋ 新規マップ読み込み</button>
        <button class="outline" onclick="showMapList()">📂 保存した地図から選択</button>
        <button class="outline" onclick="toggleTeamPanel()" style="border-color:var(--accent)">📡 チーム共有設定</button>
    </div>

    <!-- P1/P2登録画面 -->
    <div id="s2" class="step">
        <p id="guide" style="margin:0 0 10px 0; font-size:14px;">マップ上のP1地点をタップしてください</p>
        <div id="p1-inputs">
            <input type="number" id="lat1" placeholder="P1 緯度">
            <input type="number" id="lng1" placeholder="P1 経度">
            <button onclick="confirmP1()" class="blue">P1地点を確定</button>
        </div>
    </div>
</div>

<div id="team-panel">
    <h3 style="text-align:center; margin-top:0;">共有設定</h3>
    <input type="text" id="share-name" placeholder="表示名">
    <input type="text" id="share-group" placeholder="グループID">
    <button class="blue" onclick="startSharing()">共有開始</button>
    <button class="outline" onclick="toggleTeamPanel()" style="margin-top:10px;">閉じる</button>
</div>

<script>
    // 状態管理
    const state = { step: 0, x: 0, y: 0, scale: 1, isTracking: true };
    const el = id => document.getElementById(id);

    // 画面切り替えの強制化
    function showStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        const target = el('s' + n);
        if (target) {
            target.classList.add('active');
            console.log("Switched to step:", n);
        }
    }

    // 画像読み込み
    function startNewMap() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const img = el('map-img');
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                img.style.display = 'block';
                state.scale = 0.5; // 初期スケール
                showStep(2);
                el('ui-overlay').style.display = 'flex';
            };
        };
        input.click();
    }

    function toggleTeamPanel() {
        const p = el('team-panel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }

    function startSharing() {
        alert("Firebase準備中... (このデモ版ではモック動作となります)");
        toggleTeamPanel();
    }

    // 起動時の初期化チェック
    window.addEventListener('DOMContentLoaded', () => {
        console.log("App Ready");
        showStep(0); // 確実に最初の画面を表示
    });
</script>
</body>
</html>
