<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Map Tracker Pro v54.0 - Full Stable</title>
    <style>
        :root { 
            --bg: #0f172a; --panel-bg: rgba(30, 41, 59, 0.9); --accent: #3b82f6; 
            --success: #10b981; --danger: #ef4444; --text: #f8fafc;
            --glass: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.2);
            --btn-bg: rgba(255, 255, 255, 0.1); --filter-color: transparent;
        }
        /* スキン定義 (v30.3を完全維持) */
        body.theme-1 { --bg: #d2b48c; --panel-bg: rgba(210, 180, 140, 0.95); --accent: #d97706; --text: #1a1a1a; --filter-color: rgba(217, 119, 6, 0.07); }
        body.theme-2 { --bg: #2d3436; --panel-bg: rgba(60, 70, 50, 0.95); --accent: #a3b18a; --text: #dad7cd; --filter-color: rgba(163, 177, 138, 0.08); }
        body.theme-3 { --bg: #000000; --panel-bg: rgba(20, 15, 0, 0.95); --accent: #ffbf00; --text: #ffbf00; --filter-color: rgba(255, 191, 0, 0.07); }
        body.theme-4 { --bg: #000000; --panel-bg: rgba(20, 0, 0, 0.95); --accent: #ff0000; --text: #ff0000; --filter-color: rgba(255, 0, 0, 0.07); }
        body.theme-5 { --bg: #000000; --panel-bg: rgba(0, 20, 0, 0.9); --accent: #39ff14; --text: #39ff14; --filter-color: rgba(57, 255, 20, 0.08); }

        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; height: 100dvh; width: 100%; position: fixed; transition: background 0.3s, color 0.3s; }
        #viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; }
        #map-filter { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; background: var(--filter-color); transition: background 0.3s; }
        #map-container { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; z-index: 1; }
        #map-img { display: none; pointer-events: none; vertical-align: top; }
        #proximity-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5000; display: none; background: rgba(239, 68, 68, 0.25); animation: full-screen-blink 0.6s infinite; }
        @keyframes full-screen-blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; transform: translate(-50%, -50%); display: none; z-index: 1000; pointer-events: none; box-shadow: 0 0 6px rgba(0,0,0,0.5); }
        .target-marker { position: absolute; font-weight: bold; font-size: 18px; z-index: 1005; pointer-events: none; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: var(--glass); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 2px solid var(--glass-border); transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        #user-container { position: absolute; pointer-events: none; display: none; z-index: 1100; }
        #user-dot-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #user-dot { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 24px solid var(--accent); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -70%); }
        #hud-visual { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #user-container { position: absolute; pointer-events: none; display: none; z-index: 1100; }
        #user-dot-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #user-dot { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 24px solid var(--accent); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -70%); }
        #hud-visual { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #hud-info-list { position: absolute; top: 45px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 0px; padding: 4px 10px; border-radius: 10px; background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid var(--glass-border); min-width: max-content; width: auto; pointer-events: none; }
        .hud-row { font-size: 12px; font-weight: 900; text-shadow: 1px 1px 2px #000; font-family: 'SF Mono', Menlo, monospace; white-space: nowrap; display: flex; align-items: center; height: 18px; text-align: left; width: 100%; }
        .nearest-indicator { width: 8px; height: 8px; background: #ff0000; border-radius: 50%; margin-right: 8px; flex-shrink: 0; box-shadow: 0 0 4px #ff0000; }
        .nearest-placeholder { width: 8px; height: 8px; margin-right: 8px; flex-shrink: 0; visibility: hidden; }
        #line-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 900; }
        #scale-bar-container { position: fixed; bottom: 116px; right: 15px; z-index: 1200; pointer-events: none; display: none; flex-direction: column; align-items: center; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 8px; border-radius: 12px; border: 1px solid var(--glass-border); width: 110px; }
        #scale-label { font-size: 12px; font-weight: 900; text-shadow: 0 0 4px #000; margin-bottom: 4px; font-family: monospace; color: white; }
        #scale-bar { height: 4px; width: 100px; background: linear-gradient(90deg, #fff 50%, #000 50%); background-size: 20px 100%; border: 1px solid #fff; }
        
        #panel { position: fixed; bottom: 20px; left: 15px; right: 15px; padding: 15px; background: var(--panel-bg); backdrop-filter: blur(15px); border-radius: 20px; z-index: 2000; border: 1px solid rgba(255,255,255,0.1); }
        .step { display: none; } .active { display: block; }
        button { width: 100%; padding: 14px; margin: 5px 0; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; touch-action: manipulation; }
        button:active:not(:disabled) { transform: scale(0.96); opacity: 0.8; }
        button:disabled { opacity: 0.3; filter: grayscale(1); pointer-events: none; }
        .blue { background: var(--accent); color: white; } 
        .red { background: var(--danger); color: white; } 
        .outline { background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.4); color: var(--text); }
        .outline-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--text); }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: white; box-sizing: border-box; }
        .coord-row { display: flex; align-items: center; gap: 4px; }

        @media (orientation: landscape) {
            #panel:has(#s0.active), #panel:has(#s2.active) { top: 15px !important; left: 15px !important; bottom: auto !important; right: auto !important; width: 140px !important; padding: 12px !important; border-radius: 12px !important; }
            #s0 h3 { font-size: 12px !important; margin-bottom: 8px !important; text-align: center; }
            #s0 button, #s2 button { padding: 10px 0 !important; font-size: 12px !important; margin: 4px 0 !important; }
            #panel:has(#s-list.active), #panel:has(#s-import.active), #panel:has(#s-sync.active) { top: 50% !important; left: 50% !important; bottom: auto !important; right: auto !important; transform: translate(-50%, -50%) !important; width: 320px !important; padding: 20px !important; border-radius: 20px !important; max-height: 85dvh; overflow: hidden; display: flex; flex-direction: column; background: var(--panel-bg); box-shadow: 0 0 40px rgba(0,0,0,0.8); }
            #panel:has(#s4.active) { left: 15px; right: auto; top: 15px; bottom: 15px; width: 80px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: content-box; }
            #s4 { height: 100%; }
            #s4 > div { height: 100%; display: flex !important; flex-direction: column !important; justify-content: space-between !important; align-items: center !important; }
            #status { text-align: center; font-size: 11px; width: 100%; margin: 0; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
            #s4 > div > div:last-child { display: flex; flex-direction: column; width: 100%; gap: 8px; }
            #s4 button { width: 80px !important; margin: 0 !important; height: 36px !important; padding: 0 !important; font-size: 11px !important; }
            #ui-overlay { top: 50% !important; right: 15px; transform: translateY(-50%) !important; display: flex; flex-direction: column; gap: 12px; }
            #scale-bar-container { top: auto; bottom: 15px; right: 15px; display: flex !important; }
        }

        #hud-config-panel, #target-setting-panel { display: none; position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 340px; background: var(--panel-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--accent); z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .target-list-row { display: grid; grid-template-columns: 15px 1.2fr 1fr 1fr 1fr 1.2fr 1.2fr; gap: 4px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; }
        #ui-overlay { position: fixed; top: 44px; right: 15px; display: none; flex-direction: column; gap: 12px; z-index: 1002; }
        .ui-btn { width: 50px; height: 50px; background: var(--panel-bg); color: var(--text); border-radius: 12px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: 0.3s; }
        @keyframes share-blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .share-retry { animation: share-blink 0.8s infinite; color: var(--danger) !important; border-color: var(--danger) !important; }
        .share-active { color: var(--accent) !important; border-color: var(--accent) !important; }
        #target-guide { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); background: var(--panel-bg); backdrop-filter: blur(10px); border: 2px solid var(--accent); padding: 15px; border-radius: 15px; font-weight: bold; display: none; z-index: 4000; text-align: center; width: 240px; }
        .skin-opt { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; font-weight: 600; line-height: 1; white-space: nowrap; }
        .skin-opt input[type="radio"] { width: 18px; height: 18px; margin: 0; flex-shrink: 0; }
        .hud-config-columns { display: flex; gap: 20px; margin-bottom: 10px; }
        .hud-col { flex: 1; display: flex; flex-direction: column; }
        .hud-col select { width: 60px; height: 26px; border-radius: 4px; font-size: 13px; padding: 0 4px; }
        .hud-config-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 14px; font-weight: 600; }
        #btn-share { height: 75px !important; flex-direction: column; font-size: 20px; }
        #btn-share span { font-size: 10px; font-weight: bold; margin-top: 2px; color: inherit; line-height: 1.2; text-align: center; }
        .sync-setting-header { display: flex; justify-content: space-between; align-items: center; margin: 15px 0 10px 0; padding: 0 5px; }
        .sync-setting-header span { font-size: 14px; font-weight: bold; color: var(--text); }
        .sync-check-group { display: flex; gap: 12px; flex-direction: row; align-items: center; }
        .sync-check-group label { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); cursor: pointer; white-space: nowrap; }
        .id-badge { background: #1e293b; padding: 6px 12px; border-radius: 6px; font-family: monospace; font-size: 14px; border: 1px solid var(--accent); color: var(--accent); margin-bottom: 10px; width: 100%; text-align: center; box-sizing: border-box; }
        #share-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 7000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #share-modal-window { width: 85vh; height: 85vh; max-width: 90vw; max-height: 90vw; background: #000; border: 2px solid var(--accent); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        #share-modal-close { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 8px; background: #333; color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; cursor: pointer; z-index: 7010; border: none; }
        #qr-canvas-container { width: 80%; height: 80%; display: flex; align-items: center; justify-content: center; background: white; border-radius: 10px; padding: 15px; }
        #camera-video { width: 100%; height: 100%; object-fit: cover; }
        #camera-canvas { display: none; }
        .cursor-other { position: absolute; width: 9px; height: 9px; border-radius: 50%; border: 1px solid #fff; background: #3b82f6; transform: translate(-50%, -50%); z-index: 1050; pointer-events: none; box-shadow: 0 0 4px rgba(0,0,0,0.5); transition: opacity 0.3s; }
        .cursor-other::after { content: attr(data-name); position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; background: rgba(0,0,0,0.7); color: white; padding: 2px 4px; border-radius: 3px; white-space: nowrap; }
        #notice-area { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 6000; width: 90%; max-width: 320px; pointer-events: none; }
        .notice-toast { background: var(--panel-bg); color: var(--text); padding: 10px 16px; border-radius: 30px; border: 1px solid var(--accent); font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto; animation: slide-down 0.4s ease-out, fade-out 0.5s ease-in 4.5s forwards; }
        @keyframes slide-down { from { transform: translateY(-40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fade-out { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>

<div id="notice-area"></div>
<div id="proximity-overlay"></div>
<div id="viewport">
    <div id="map-container"><img id="map-img"></div>
    <div id="map-filter"></div>
    <svg id="line-svg"></svg>
    <div id="p1-dot" class="dot"></div>
    <div id="p2-dot" class="dot"></div>
    <div id="temp-target-dot" class="dot"></div>
    <div id="target-layer"></div>
    <div id="other-cursors-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1090;"></div>
    <div id="user-container">
        <div id="user-dot-wrapper">
             <div id="user-dot"></div>
             <svg id="hud-visual" width="1000" height="1000" viewBox="0 0 1000 1000">
                <circle cx="500" cy="500" r="0" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" id="hud-circle" />
                <path id="hud-wedge" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.5)" stroke-width="2" />
            </svg>
        </div>
        <div id="hud-info-list" style="display:none;"></div>
    </div>
</div>

<div id="scale-bar-container"><div id="scale-label">---m</div><div id="scale-bar"></div></div>

<div id="share-modal-overlay">
    <div id="share-modal-window">
        <div id="share-modal-close" onclick="closeShareModal()">✖</div>
        <div id="qr-canvas-container" style="display:none;"><div id="qr-code"></div></div>
        <video id="camera-video" autoplay playsinline style="display:none;"></video>
        <canvas id="camera-canvas"></canvas>
        <div id="share-modal-status" style="position:absolute; bottom:20px; color:white; background:rgba(0,0,0,0.6); padding:5px 15px; border-radius:20px; font-size:12px;"></div>
    </div>
</div>

<div id="target-guide">
    <div id="target-guide-text" style="margin-bottom:12px;"></div>
    <div style="display:flex; gap:10px;">
        <button id="target-decide-btn" class="blue" style="margin:0; padding:10px; flex:1;">決定</button>
        <button id="target-cancel-btn" class="outline" style="margin:0; padding:10px; flex:1;" onclick="cancelTargeting()">戻る</button>
    </div>
</div>

<div id="target-setting-panel">
    <p style="text-align:center; font-weight:bold;">続けて次の目標を設定しますか？</p>
    <div style="display:flex; gap:10px;">
        <button class="blue" onclick="continueTargetFlow()">はい</button>
        <button class="outline" onclick="closeTargetFlow()">いいえ</button>
    </div>
</div>

<div id="hud-config-panel">
    <h3 style="margin:0 0 15px 0; text-align:center; color:var(--accent);">HUD設定</h3>
    <div class="hud-config-columns">
        <div class="hud-col">
            <div class="hud-config-row"><span>HUD表示</span><input type="checkbox" id="hud-enable" onchange="updateHudSettings()" style="width:20px; margin:0;"></div>
            <div class="hud-config-row"><span>スキン切り替え</span><input type="checkbox" id="skin-enable" onchange="toggleSkinList()" style="width:20px; margin:0;"></div>
            <div id="skin-list-area" style="display:none; padding:8px 12px; background:rgba(0,0,0,0.2); border-radius:10px; margin-top:5px;">
                <div class="skin-opt"><input type="radio" name="skin" value="1" onchange="applySkin(1)"><span>1.デザート•サンド</span></div>
                <div class="skin-opt"><input type="radio" name="skin" value="2" onchange="applySkin(2)"><span>2.フォレスト•カモ</span></div>
                <div class="skin-opt"><input type="radio" name="skin" value="3" onchange="applySkin(3)"><span>3.アンバー•レトロ</span></div>
                <div class="skin-opt"><input type="radio" name="skin" value="4" onchange="applySkin(4)"><span>4.レッド•インフラ</span></div>
                <div class="skin-opt"><input type="radio" name="skin" value="5" onchange="applySkin(5)"><span>5.コクピット•イルミ</span></div>
            </div>
        </div>
        <div class="hud-col">
            <div class="hud-config-row"><span>サークル半径</span><select id="hud-radius-select" onchange="updateHudSettings()" style="background:#1a1a1a;color:white; margin:0;"></select></div>
            <div class="hud-config-row"><span>近接通知</span><input type="checkbox" id="proximity-enable" onchange="updateHudSettings()" style="width:20px; margin:0;"></div>
            <div class="hud-config-row"><span>新規目標追加</span><input type="checkbox" id="target-enable" onchange="handleTargetCheck(this)" style="width:20px; margin:0;"></div>
            <div id="target-config-list" style="max-height:160px; overflow-y:auto; border-top:1px solid #444; margin-top:10px;"></div>
        </div>
    </div>
    <div style="display:flex; justify-content:center;">
        <button class="blue" onclick="toggleHudConfig()" style="margin-top:10px; width:120px;">閉じる</button>
    </div>
</div>

<div id="ui-overlay">
    <div id="btn-lock" class="ui-btn" onclick="toggleTracking()">🎯</div>
    <div id="btn-rotate" class="ui-btn" onclick="cycleRotateMode()">🧭</div>
    <div id="btn-share" class="ui-btn" onclick="openShareMenu()">📡<span>シェア<br><span id="share-indicator">--</span></span></div>
</div>

<div id="panel">
    <div id="s0" class="step active">
        <h3 style="margin:0;color:var(--accent); font-size:16px;">Map Tracker Pro v54.0</h3>
        <button class="blue" onclick="startNewMap()">＋ 新規マップ</button>
        <button class="outline" onclick="showMapList()">📂 保存地図</button>
        <button class="outline" onclick="showImportScreen()" style="border-color:var(--success)">📥 インポート</button>
    </div>
    
    <div id="s2" class="step">
        <p id="guide" style="margin:0 0 5px 0; font-weight:bold; font-size: 13px;">地点1をタップ</p>
        <div id="p1-inputs">
            <div class="coord-row"><input type="text" id="lat1_int" placeholder="35">. <input type="text" id="lat1_dec" placeholder="00000"></div>
            <div class="coord-row"><input type="text" id="lng1_int" placeholder="135">. <input type="text" id="lng1_dec" placeholder="00000"></div>
            <button onclick="confirmP1()" class="red">P1登録</button>
        </div>
        <div id="p2-inputs" style="display:none">
            <div class="coord-row"><input type="text" id="lat2_int" placeholder="35">. <input type="text" id="lat2_dec" placeholder="00001"></div>
            <div class="coord-row"><input type="text" id="lng2_int" placeholder="135">. <input type="text" id="lng2_dec" placeholder="00001"></div>
            <button onclick="confirmP2()" class="blue" style="background:var(--success)">P2登録</button>
        </div>
    </div>

    <div id="s4" class="step">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div id="status" style="font-size:13px; font-weight:bold;">GPS待機中...</div>
            <div style="display:flex; gap:6px;">
                <button id="proximity-dismiss-btn" onclick="dismissProximity()" class="outline-danger" style="display:none; margin:0; padding:8px 10px; font-size:12px; width:auto; height:36px;">通知解除</button>
                <button id="gyro-btn" onclick="askGyro()" class="blue" style="margin:0; padding:8px 10px; font-size:12px; width:auto; height:36px;">🧭 方位許可</button>
                <button onclick="toggleHudConfig()" class="outline" style="padding:8px; font-size:12px; width:80px; margin:0; height:36px;">HUD設定</button>
                <button onclick="exitApp()" class="outline-danger" style="padding:8px; font-size:12px; width:50px; margin:0; height:36px;">終了</button>
            </div>
        </div>
    </div>

    <div id="s-list" class="step">
        <h3 style="margin:0 0 15px 0; text-align:center; color:var(--accent);">保存済みマップ</h3>
        <div id="map-list-container" style="max-height:300px; overflow-y:auto; margin-bottom:15px;"></div>
        <button class="outline" onclick="showStep(0)">戻る</button>
    </div>

    <div id="s-import" class="step">
        <h3 style="margin:0 0 15px 0; text-align:center; color:var(--success);">インポート</h3>
        <button class="blue" onclick="triggerImportFile()">ファイルを選択</button>
        <button class="outline" onclick="showStep(0)" style="margin-top:10px;">キャンセル</button>
    </div>

    <div id="s-sync" class="step">
        <h3 style="margin:0 0 15px 0; text-align:center; color:var(--accent);">Group share mode</h3>
        <div class="sync-setting-header">
            <span>グループ設定</span>
            <div class="sync-check-group">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect, update, goOffline, goOnline } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDKPvOcJ0y79_7_oVW0KF8YR0iKcF4o_cc",
        authDomain: "tac-map-multi.firebaseapp.com",
        databaseURL: "https://tac-map-multi-default-rtdb.firebaseio.com",
        projectId: "tac-map-multi",
        storageBucket: "tac-map-multi.firebasestorage.app",
        messagingSenderId: "530840369600",
        appId: "1:530840369600:web:88b595c9789acd54b4b025"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getDatabase(fbApp);
    
    // --- Session Persistence ---
    const savedUid = localStorage.getItem('pwa_uid');
    let myUid = savedUid || 'U' + Math.random().toString(36).substring(2, 7).toUpperCase();
    localStorage.setItem('pwa_uid', myUid);

    let syncEnabled = false;
    let syncActive = false; 
    let gid = localStorage.getItem('pwa_gid') || "";
    let activeUserCount = 1;
    let appResumeTime = Date.now(); // 復帰判定用
    let wasLostLocally = false; // 自身が切断/ロスト状態にあったかの追跡フラグ

    window.remoteUsers = {};

    window.showNotice = function(msg) {
        const area = document.getElementById('notice-area');
        const toast = document.createElement('div');
        toast.className = 'notice-toast';
        toast.innerText = msg;
        toast.onclick = () => toast.remove();
        area.appendChild(toast);
        setTimeout(() => { if(toast.parentNode) toast.remove(); }, 5000);
    };

    function updateSyncButtons() {
        const initial = document.getElementById('sync-initial-btns');
        const active = document.getElementById('sync-active-btns');
        initial.style.display = syncEnabled ? 'none' : 'flex';
        active.style.display = syncEnabled ? 'flex' : 'none';
    }

    function refreshSyncUI(isConnected) {
        const msgEl = document.getElementById('fb-status-msg');
        const shareBtn = document.getElementById('btn-share');
        const indicator = document.getElementById('share-indicator');
        if (syncEnabled) {
            if (isConnected && syncActive) {
                msgEl.innerText = `同期中: ${gid} / 接続数 ${activeUserCount}`;
                shareBtn.className = 'ui-btn share-active';
                indicator.innerText = "●";
            } else {
                msgEl.innerText = "";
                shareBtn.className = 'ui-btn share-retry';
                indicator.innerText = "🚫";
            }
        } else {
            msgEl.innerText = "";
            shareBtn.className = 'ui-btn';
            indicator.innerText = "--";
        }
    }

    onValue(ref(db, ".info/connected"), (snapshot) => { 
        const isConnected = snapshot.val() === true;
        if (isConnected && syncEnabled && gid && myUid) {
            // 切断予約時、データを丸ごと物理削除(remove)するのではなく、「isLost: true」フラグを立ててタイムスタンプを刻むように変更
            onDisconnect(ref(db, `groups/${gid}/users/${myUid}`)).update({
                isLost: true,
                ts: Date.now()
            });
        }
        refreshSyncUI(isConnected); 
    });

    window.openSyncMenu = function() {
        haptic();
        document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
        document.getElementById('s-sync').classList.add('active');
        if(!gid) {
            gid = Math.random().toString(36).substring(2, 8).toUpperCase();
        }
        document.getElementById('share-id-display').innerText = "ID: " + gid;
    };

    window.handleShareCheck = function(mode) {
        const checkCreate = document.getElementById('check-create');
        const checkRead = document.getElementById('check-read');
        if(mode === 'create') {
            if(checkCreate.checked) {
                checkRead.checked = false;
                openShareModal('create');
            }
        } else if(mode === 'read') {
            if(checkRead.checked) {
                checkCreate.checked = false;
                openShareModal('read');
            }
        }
    };

    let scanStream = null;
    let scanRequest = null;
    window.openShareModal = function(type) {
        const overlay = document.getElementById('share-modal-overlay');
        const qrContainer = document.getElementById('qr-canvas-container');
        const video = document.getElementById('camera-video');
        const status = document.getElementById('share-modal-status');
        overlay.style.display = 'flex';
        qrContainer.style.display = 'none';
        video.style.display = 'none';
        if(type === 'create') {
            qrContainer.style.display = 'flex';
            const qrTarget = document.getElementById('qr-code');
            qrTarget.innerHTML = "";
            new QRCode(qrTarget, { text: gid, width: 200, height: 200 });
            status.innerText = "グループ参加用QRコード";
        } else if(type === 'read') {
            video.style.display = 'block';
            status.innerText = "QRコードをスキャン中...";
            startCamera();
        }
    };

    window.closeShareModal = function() {
        document.getElementById('share-modal-overlay').style.display = 'none';
        document.getElementById('check-create').checked = false;
        document.getElementById('check-read').checked = false;
        stopCamera();
    };

    async function startCamera() {
        try {
            scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            const video = document.getElementById('camera-video');
            video.srcObject = scanStream;
            video.play();
            requestAnimationFrame(tickScan);
        } catch (err) { alert("カメラ起動失敗"); closeShareModal(); }
    }

    function stopCamera() {
        if (scanStream) scanStream.getTracks().forEach(track => track.stop());
        if (scanRequest) cancelAnimationFrame(scanRequest);
        scanStream = null;
    }

    function tickScan() {
        const video = document.getElementById('camera-video');
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            const canvas = document.getElementById('camera-canvas');
            canvas.height = video.videoHeight; canvas.width = video.videoWidth;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code) {
                gid = code.data.toUpperCase();
                document.getElementById('share-id-display').innerText = "ID: " + gid;
                window.showNotice("ID読取成功: " + gid);
                closeShareModal();
                return;
            }
        }
        scanRequest = requestAnimationFrame(tickScan);
    }

    window.startFirebaseSync = function(isManualButton = false) {
        if(!gid) return;
        localStorage.setItem('pwa_gid', gid);
        syncEnabled = true; syncActive = true; 
        goOnline(db);
        
        // ①-A: 共有開始ボタンによる能動的な接続時メッセージ
        if (isManualButton) {
            const myName = document.getElementById('user-nickname').value || "Player";
            window.showNotice(`${myName}が参加しました`);
            wasLostLocally = false;
        }

        onValue(ref(db, `groups/${gid}/users`), (snapshot) => {
            const users = snapshot.val();
            activeUserCount = users ? Object.keys(users).length : 1;
            processRemoteUsers(users);
            refreshSyncUI(true);
        });
        updateSyncButtons();
    };

    document.getElementById('fb-start-btn').onclick = () => {
        if(!gid) { alert("ID未設定"); return; }
        window.startFirebaseSync(true);
    };

    document.getElementById('fb-stop-btn').onclick = () => {
        if(confirm("共有を終了しますか？")) { 
            // ②-C: 同期終了ボタンによる明示的な切断時メッセージ
            const myName = document.getElementById('user-nickname').value || "Player";
            window.showNotice(`${myName}が退場しました`);
            window.killSync(); 
            updateSyncButtons(); 
        }
    };

    setInterval(() => {
        if(syncEnabled && syncActive && window.state && window.state.userPos && window.state.userPos.x) {
            const myName = document.getElementById('user-nickname').value || "Player";
            
            // ①-B: 共有開始ボタン以外での接続（ロスト状態・バックグラウンドからの復帰判定）
            if (wasLostLocally) {
                window.showNotice(`${myName}が復帰しました`);
                wasLostLocally = false;
            }

            update(ref(db, `groups/${gid}/users/${myUid}`), {
                x: window.state.userPos.x, y: window.state.userPos.y,
                name: myName, ts: Date.now(), isLost: false
            }).then(() => { if(!syncActive) { syncActive = true; refreshSyncUI(true); } });
            localStorage.setItem('pwa_session_ts', Date.now().toString());
        }
    }, 1000);

    window.killSync = function() {
        if (syncEnabled && gid && myUid) set(ref(db, `groups/${gid}/users/${myUid}`), null);
        syncEnabled = false; syncActive = false;
        localStorage.removeItem('pwa_gid');
        localStorage.removeItem('pwa_session_ts');
        goOffline(db);
        window.remoteUsers = {};
        const layer = document.getElementById('other-cursors-layer');
        if(layer) layer.innerHTML = '';
        refreshSyncUI(false);
    };

    // --- 共有状態メッセージ（離退場・タイムアウト判定追加）パッチ適用 ---
    function processRemoteUsers(users) {
        if(!syncEnabled) return;
        const now = Date.now();

        Object.keys(window.remoteUsers).forEach(uid => {
            if(!users || !users[uid]) { 
                delete window.remoteUsers[uid]; 
            }
        });
        if(!users) return;
        Object.keys(users).forEach(uid => {
            if(uid === myUid) return;
            const data = users[uid];
            
            // ②-D: ロスト(10秒超)から、3分経過して非表示へと切り替わったタイミングの判定
            if (now - data.ts > 180000) {
                 if(window.remoteUsers[uid]) {
                     window.showNotice(`${data.name}はタイムアウトにより非表示です`);
                     delete window.remoteUsers[uid];
                 }
                 return;
            }
            if(!window.remoteUsers[uid]) {
                window.remoteUsers[uid] = { currX: data.x, currY: data.y, targetX: data.x, targetY: data.y, name: data.name, ts: data.ts, isLost: data.isLost || false };
            } else {
                window.remoteUsers[uid].targetX = data.x;
                window.remoteUsers[uid].targetY = data.y;
                window.remoteUsers[uid].name = data.name;
                window.remoteUsers[uid].ts = data.ts;
                window.remoteUsers[uid].isLost = data.isLost || false;
            }
        });
    }

    // サスペンド復帰・バックグラウンド移行時のフラグセット
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            appResumeTime = Date.now();
            // 画面が戻った時、前回同期中かつ現在時刻との差などから自動で復帰判定を入れる
            if (syncEnabled && gid) {
                wasLostLocally = true; 
                syncActive = true;
                goOnline(db);
            }
        } else {
            if (syncEnabled && syncActive && gid && myUid) {
                syncActive = false;
                wasLostLocally = true;
                // Safari切断前の最後のデータ送信。tsは誤判定を防ぐため現在時刻をそのまま送信
                update(ref(db, `groups/${gid}/users/${myUid}`), {
                    isLost: true,
                    ts: Date.now()
                }).then(() => {
                    goOffline(db);
                });
            }
        }
    });

    // --- Boot Recovery Logic ---
    window.addEventListener('load', () => {
        const lastTs = parseInt(localStorage.getItem('pwa_session_ts') || "0");
        const lastMapId = localStorage.getItem('pwa_active_map_id');
        const now = Date.now();
        
        if (lastMapId && (now - lastTs < 600000)) {
            window.recoveryMap(parseInt(lastMapId));
            const savedNick = localStorage.getItem('pwa_nick');
            if(savedNick) document.getElementById('user-nickname').value = savedNick;
            if (gid) {
                // 自動復帰ロードの場合は、ボタン以外の接続(復帰)とするためフラグ追跡
                wasLostLocally = true;
                setTimeout(() => window.startFirebaseSync(false), 500);
            }
        } else {
            localStorage.removeItem('pwa_gid');
            localStorage.removeItem('pwa_session_ts');
            localStorage.removeItem('pwa_active_map_id');
            localStorage.removeItem('pwa_targets');
        }
    });

    document.getElementById('user-nickname').addEventListener('change', (e) => {
        localStorage.setItem('pwa_nick', e.target.value);
    });

</script>

<script>
    const DB_NAME = "MapTrackerDB", STORE_NAME = "maps";
    let idb, pointers = [], lastDist = 0, lastPoint = null, locationHistory = []; 
    let watchId = null; 
    const state = { 
        step: 0, p1: null, p2: null, scale: 1, x: 0, y: 0, isTracking: true, rotateMode: 0, mapNorth: 0, metersPerPixel: 0,
        userPos: {x:0, y:0}, userHeading: 0, rawHeading: 0, tempPoint: null, hudOn: false, hudRadius: 20, proximityOn: false, 
        isAlerting: false, manuallyDismissed: false, targets: [], targetMode: false, currentTargetLetter: null, 
        colors: ["#facc15", "#a855f7", "#f97316", "#22d3ee", "#fb7185"],
        lastRot: 0, lastRotateMode: 0
    };
    window.state = state;

    function haptic() { if (window.navigator.vibrate) window.navigator.vibrate(10); }
    function openShareMenu() { if(window.openSyncMenu) window.openSyncMenu(); }
    function closeSyncMenu() { haptic(); showStep(4); }

    const initDB = () => new Promise(r => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: "id", autoIncrement: true });
        req.onsuccess = e => { idb = e.target.result; r(); };
    });
    const el = id => document.getElementById(id), vNode = el('viewport'), container = el('map-container');
    for(let r=5; r<=50; r+=5){ const opt=document.createElement('option'); opt.value=r; opt.textContent=r; if(r===20)opt.selected=true; el('hud-radius-select').appendChild(opt); }
    
    window.onload = async () => { await initDB(); loadSkinPreference(); renderLoop(); };
    function renderLoop() { render(); requestAnimationFrame(renderLoop); }

    function loadSkinPreference() {
        const skin = localStorage.getItem('selectedSkin');
        if(localStorage.getItem('skinEnabled') === 'true' && skin) {
            el('skin-enable').checked = true; el('skin-list-area').style.display = 'block';
            const radio = document.querySelector(`input[name="skin"][value="${skin}"]`);
            if(radio) { radio.checked = true; applySkin(skin, false); }
        }
    }
    function toggleSkinList() {
        const isOn = el('skin-enable').checked;
        el('skin-list-area').style.display = isOn ? 'block' : 'none';
        localStorage.setItem('skinEnabled', isOn);
        if(!isOn) { document.body.className = ''; localStorage.removeItem('selectedSkin'); }
    }
    function applySkin(val, save=true) { haptic(); document.body.className = 'theme-' + val; if(save) localStorage.setItem('selectedSkin', val); }

    function showStep(n){ haptic(); document.querySelectorAll('.step').forEach(s=>s.classList.remove('active')); if(el('s'+n)) el('s'+n).classList.add('active'); state.step=n; }
    
    function startNewMap() { 
        haptic(); const input = document.createElement('input'); input.type='file'; input.accept='image/*'; 
        input.onchange=e=>{ 
            const file=e.target.files[0]; if(!file)return; 
            state.currentImgBlob=file; 
            const img = el('map-img'); img.src = URL.createObjectURL(file); 
            img.onload = () => { img.style.display='block'; fitImage(); showStep(2); }; 
        }; input.click(); 
    }

    function showImportScreen() { haptic(); showStep('-import'); }

    function triggerImportFile() {
        const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
        input.onchange = async e => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    const base64Parts = data.image_b64.split(',');
                    const contentType = base64Parts[0].match(/:(.*?);/)[1];
                    const raw = window.atob(base64Parts[1]);
                    const uInt8Array = new Uint8Array(raw.length);
                    for (let i = 0; i < raw.length; ++i) uInt8Array[i] = raw.charCodeAt(i);
                    const blob = new Blob([uInt8Array], {type: contentType});
                    const tx = idb.transaction(STORE_NAME, "readwrite");
                    tx.objectStore(STORE_NAME).add({ name: data.name || "Imported", image: blob, p1: data.p1, p2: data.p2, mapNorth: data.mapNorth || 0, metersPerPixel: data.metersPerPixel || 0 });
                    tx.oncomplete = () => { alert("インポート完了！"); showMapList(); };
                } catch(err) { alert("失敗"); }
            }; reader.readAsText(file);
        }; input.click();
    }

    async function showMapList() {
        haptic(); showStep('-list'); const listEl = el('map-list-container'); listEl.innerHTML = "";
        const tx = idb.transaction(STORE_NAME, "readonly");
        const maps = await new Promise(r => { tx.objectStore(STORE_NAME).getAll().onsuccess = e => r(e.target.result); });
        maps.forEach(m => {
            const d = document.createElement('div'); d.style="display:grid; grid-template-columns: 1fr 50px 50px 50px; gap:5px; margin-bottom:8px; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; align-items:center;";
            d.innerHTML = `<span style="font-size:12px; font-weight:bold; overflow:hidden;">${m.name}</span>
            <button class="blue" style="padding:8px; margin:0; font-size:11px" onclick="loadMap(${m.id})">開く</button>
            <button class="outline" style="padding:8px; margin:0; font-size:11px" onclick="exportMap(${m.id})">共有</button>
            <button class="red" style="padding:8px; margin:0; font-size:11px" onclick="deleteMap(${m.id})">削除</button>`;
            listEl.appendChild(d);
        });
    }

    window.recoveryMap = async function(id) {
        if(!idb) await initDB();
        const tx = idb.transaction(STORE_NAME, "readonly");
        tx.objectStore(STORE_NAME).get(id).onsuccess = e => {
            const data = e.target.result;
            if(!data) return;
            state.p1 = data.p1; state.p2 = data.p2; state.mapNorth = data.mapNorth; state.metersPerPixel = data.metersPerPixel;
            const img = el('map-img'); img.src = URL.createObjectURL(data.image); 
            img.onload = () => { img.style.display='block'; fitImage(); 
                const savedTargets = localStorage.getItem('pwa_targets');
                if(savedTargets) state.targets = JSON.parse(savedTargets);
                saveAndStart(id); 
            };
        };
    };

    async function loadMap(id) {
        haptic(); 
        window.recoveryMap(id);
    }

    async function exportMap(id) {
        const tx = idb.transaction(STORE_NAME, "readonly");
        tx.objectStore(STORE_NAME).get(id).onsuccess = e => {
            const d = e.target.result; const r = new FileReader();
            r.onload = () => {
                const blob = new Blob([JSON.stringify({name:d.name, p1:d.p1, p2:d.p2, mapNorth:d.mapNorth, metersPerPixel:d.metersPerPixel, image_b64:r.result})], {type: 'application/json'});
                const url = URL.createObjectURL(blob), a = document.createElement('a');
                a.href = url; a.download = `${d.name}.json`; a.click();
            }; r.readAsDataURL(d.image);
        };
    }

    function fitImage() {
        const img = el('map-img'), vw = vNode.clientWidth, vh = vNode.clientHeight;
        state.scale = Math.min(vw/img.naturalWidth, vh/img.naturalHeight)*0.8;
        state.x = vw/2 - (img.naturalWidth/2*state.scale); state.y = vh/2 - (img.naturalHeight/2*state.scale);
    }

    vNode.addEventListener('pointerdown', e => { vNode.setPointerCapture(e.pointerId); pointers.push(e); if(pointers.length === 1) lastPoint = { x: e.clientX, y: e.clientY }; else if(pointers.length === 2) lastDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY); });
    vNode.addEventListener('pointermove', e => {
        const idx = pointers.findIndex(p => p.pointerId === e.pointerId); if(idx === -1) return; pointers[idx] = e;
        if(pointers.length === 1 && lastPoint) { state.x += e.clientX - lastPoint.x; state.y += e.clientY - lastPoint.y; lastPoint = { x: e.clientX, y: e.clientY }; state.isTracking = false; } 
        else if(pointers.length === 2) { const midX = (pointers[0].clientX + pointers[1].clientX) / 2, midY = (pointers[0].clientY + pointers[1].clientY) / 2, dist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY), zoom = dist / lastDist; state.scale *= zoom; state.x = midX - (midX - state.x) * zoom; state.y = midY - (midY - state.y) * zoom; lastDist = dist; state.isTracking = false; }
    });
    const endPointer = e => { if(pointers.length === 1 && (state.step === 2 || state.targetMode)) handleTap(e); pointers = pointers.filter(p => p.pointerId !== e.pointerId); if(pointers.length < 2) lastDist = 0; if(pointers.length === 0) lastPoint = null; };
    vNode.addEventListener('pointerup', endPointer); vNode.addEventListener('pointercancel', endPointer);

    function handleTap(e) {
        const vw = vNode.clientWidth, vh = vNode.clientHeight;
        let screenAdj = (window.orientation === 90) ? 90 : (window.orientation === -90) ? -90 : 0;
        const finalHeading = state.userHeading + screenAdj;
        const rot = (state.rotateMode === 1) ? -state.mapNorth : (state.rotateMode === 2) ? -state.mapNorth - finalHeading : 0;
        const rad = -rot * Math.PI / 180, sx = vw / 2, sy = (state.rotateMode === 2) ? vh * 0.7 : vh / 2;
        const dx = e.clientX - sx, dy = e.clientY - sy, rx = dx * Math.cos(rad) - dy * Math.sin(rad), ry = dx * Math.sin(rad) + dy * Math.cos(rad);
        state.tempPoint = { x: (rx + sx - state.x) / state.scale, y: (ry + sy - state.y) / state.scale };
    }

    function lerp(s, e, a) { return (1 - a) * s + a * e; }
    function lerpA(a, b, m) { let d = b - a; while (d < -180) d += 360; while (d > 180) d -= 360; return a + d * m; }

    function exitApp() {
        if(confirm("アプリケーションを終了しますか？")) {

            if (window.killSync) window.killSync();
            location.reload();
        }
